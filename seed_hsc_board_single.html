<script>
var CFG={apiKey:"AIzaSyAfD5wwaIhmtPbl50Z6d-Zlvzqk6Ob_FW8",authDomain:"physicists-perspective.firebaseapp.com",projectId:"physicists-perspective",storageBucket:"physicists-perspective.firebasestorage.app",messagingSenderId:"186707877920",appId:"1:186707877920:web:38f757b3016e1af3539c45"};
firebase.initializeApp(CFG);
var auth=firebase.auth(), db=firebase.firestore();
var log=document.getElementById("log");
function L(s){ log.textContent+=s+"\n"; }
auth.onAuthStateChanged(function(u){
  document.getElementById("who").textContent = u ? ("Signed in: "+u.email+" ("+u.uid+")") : "Not signed in.";
  document.getElementById("btnSeed").disabled = !u;
});
document.getElementById("btnLogin").addEventListener("click",function(){
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e){ L("LOGIN ERR: "+e.message); });
});
document.getElementById("btnSeed").addEventListener("click",async function(){
  this.disabled=true;
  var ids=Object.keys(window.SEED_HSCB), ok=0, fail=0;
  for (var i=0;i<ids.length;i++){
    var id=ids[i], d=window.SEED_HSCB[id];
    try{ await db.collection("exams").doc(id).set({title:d.title,chapter:d.chapter,level:d.level,minutes:d.minutes,qjson:d.qjson}); ok++; L("OK "+id); }
    catch(e){ fail++; L("FAIL "+id+": "+e.message); }
  }
  L("SEED DONE ok="+ok+" fail="+fail);
  // read-back verification: every doc exists with the expected question count
  var vok=0, vbad=0;
  for (var i=0;i<ids.length;i++){
    var id=ids[i];
    try{
      var snap=await db.collection("exams").doc(id).get();
      var qs=JSON.parse(snap.data().qjson);
      var want=JSON.parse(window.SEED_HSCB[id].qjson).length;
      if (snap.exists && qs.length===want) { vok++; }
      else { vbad++; L("VERIFY MISMATCH "+id+": got "+(snap.exists?qs.length:"missing")+" want "+want); }
    }catch(e){ vbad++; L("VERIFY FAIL "+id+": "+e.message); }
  }
  L("VERIFY DONE ok="+vok+" bad="+vbad);
});
</script>
