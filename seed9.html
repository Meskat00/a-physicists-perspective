<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seed SSC board/test exams (one-time)</title></head>
<body style="font-family:sans-serif;max-width:720px;margin:40px auto;padding:0 16px">
<h2>One-time seed: 74 SSC board + test exams</h2>
<p id="who">Not signed in.</p>
<button id="btnLogin" style="padding:10px 18px;font-size:16px">Sign in with Google (owner)</button>
<button id="btnSeed" style="padding:10px 18px;font-size:16px" disabled>Seed 74 exams</button>
<p style="color:#555">Sign in চাপলে Google-এর পেজে যাবে — সাইন-ইন শেষ হলে নিজে থেকেই এই পেজে ফিরে আসবে, তখন "Seed 74 exams" চাপবে। বোতামে একবারই ক্লিক করবে।</p>
<pre id="log" style="white-space:pre-wrap;background:#f4f4f4;padding:12px;border-radius:8px;min-height:200px"></pre>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
<script src="seed-data9.js"></script>
<script>
var CFG={apiKey:"AIzaSyAfD5wwaIhmtPbl50Z6d-Zlvzqk6Ob_FW8",authDomain:"physicists-perspective.firebaseapp.com",projectId:"physicists-perspective",storageBucket:"physicists-perspective.firebasestorage.app",messagingSenderId:"186707877920",appId:"1:186707877920:web:38f757b3016e1af3539c45"};
firebase.initializeApp(CFG);
if (firebase.appCheck) { try { firebase.appCheck().activate(new firebase.appCheck.ReCaptchaEnterpriseProvider("6LeG3PotAAAAADlJ4FodEFapAdlI14Hz2KDpPS8T"), true); } catch(e){} }
var auth=firebase.auth(), db=firebase.firestore();
var log=document.getElementById("log");
function L(s){ log.textContent+=s+"\n"; }
auth.getRedirectResult().catch(function(e){ L("LOGIN ERR: "+e.message); });
auth.onAuthStateChanged(function(u){
  document.getElementById("who").textContent = u ? ("Signed in: "+u.email+" ("+u.uid+")") : "Not signed in.";
  document.getElementById("btnSeed").disabled = !u;
  document.getElementById("btnLogin").style.display = u ? "none" : "";
});
document.getElementById("btnLogin").addEventListener("click",function(){
  this.disabled=true; this.textContent="Google sign-in-এ যাচ্ছে…";
  auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()).catch(function(e){ L("LOGIN ERR: "+e.message); });
});
document.getElementById("btnSeed").addEventListener("click",async function(){
  this.disabled=true;
  var cu = auth.currentUser; L("ACTING UID: " + (cu ? cu.uid : "NONE"));
  if (firebase.appCheck) { try { var tk = await firebase.appCheck().getToken(true); L("APPCHECK token OK, length " + (tk && tk.token ? tk.token.length : 0)); } catch(e){ L("APPCHECK token FAIL: " + e.message); } }
  var ids=Object.keys(window.SEED9), ok=0, fail=0;
  for (var i=0;i<ids.length;i++){
    var id=ids[i], d=window.SEED9[id];
    var doc={title:d.title,chapter:d.chapter,level:d.level,minutes:d.minutes,qjson:d.qjson};
    if(d.neg) doc.neg=d.neg;
    try{ await db.collection("exams").doc(id).set(doc); ok++; L("OK "+id); }
    catch(e){ fail++; L("FAIL "+id+": "+e.message); }
  }
  L("DONE ok="+ok+" fail="+fail);
});
</script>
</body></html>
