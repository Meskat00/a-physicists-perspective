<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seed exams (one-time)</title></head>
<body style="font-family:sans-serif;max-width:720px;margin:40px auto;padding:0 16px">
<h2>One-time seed: 29 timed exams</h2>
<p id="who">Not signed in.</p>
<button id="btnLogin" style="padding:10px 18px;font-size:16px">Sign in with Google (owner)</button>
<button id="btnSeed" style="padding:10px 18px;font-size:16px" disabled>Seed 29 exams</button>
<pre id="log" style="white-space:pre-wrap;background:#f4f4f4;padding:12px;border-radius:8px;min-height:200px"></pre>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="seed-data2.js"></script>
<script>
var CFG={apiKey:"AIzaSyAfD5wwaIhmtPbl50Z6d-Zlvzqk6Ob_FW8",authDomain:"physicists-perspective.firebaseapp.com",projectId:"physicists-perspective",storageBucket:"physicists-perspective.firebasestorage.app",messagingSenderId:"186707877920",appId:"1:186707877920:web:38f757b3016e1af3539c45"};
firebase.initializeApp(CFG);
var auth=firebase.auth(), db=firebase.firestore();
var log=document.getElementById("log");
function L(s){ log.textContent+=s+"\n"; }
auth.onAuthStateChanged(function(u){
  document.getElementById("who").textContent = u ? ("Signed in: "+u.email+" ("+u.uid+")") : "Not signed in.";
  document.getElementById("btnSeed").disabled = !u;
});
document.getElementById("btnLogin").addEventListener("click",function(){
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e){ L("LOGIN ERR: "+e.message); });
});
document.getElementById("btnSeed").addEventListener("click",async function(){
  this.disabled=true;
  var ids=Object.keys(window.SEED2), ok=0, fail=0;
  for (var i=0;i<ids.length;i++){
    var id=ids[i], d=window.SEED2[id];
    try{ await db.collection("exams").doc(id).set({title:d.title,chapter:d.chapter,level:d.level,minutes:d.minutes,qjson:d.qjson}); ok++; L("OK "+id); }
    catch(e){ fail++; L("FAIL "+id+": "+e.message); }
  }
  L("DONE ok="+ok+" fail="+fail);
});
</script>
</body></html>
