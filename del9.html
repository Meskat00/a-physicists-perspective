<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delete SSC model exams (one-time)</title></head>
<body style="font-family:sans-serif;max-width:720px;margin:40px auto;padding:0 16px">
<h2>One-time delete: 6 SSC special model test exams (ssc-m-01..06)</h2>
<p id="who">Not signed in.</p>
<button id="btnLogin" style="padding:10px 18px;font-size:16px">Sign in with Google (owner)</button>
<button id="btnDel" style="padding:10px 18px;font-size:16px" disabled>Delete 6 model exams</button>
<p style="color:#555">বোতামে একবারই ক্লিক করবে। এই পেজ শুধু ssc-m-01 থেকে ssc-m-06 — এই ৬টি ডকুমেন্টই ডিলিট করে।</p>
<pre id="log" style="white-space:pre-wrap;background:#f4f4f4;padding:12px;border-radius:8px;min-height:200px"></pre>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
<script>
var CFG={apiKey:"<redacted>",authDomain:"physicists-perspective.firebaseapp.com",projectId:"physicists-perspective",storageBucket:"physicists-perspective.firebasestorage.app",messagingSenderId:"186707877920",appId:"1:186707877920:web:38f757b3016e1af3539c45"};
firebase.initializeApp(CFG);
if (firebase.appCheck) { try { firebase.appCheck().activate(new firebase.appCheck.ReCaptchaEnterpriseProvider("6LeG3PotAAAAADlJ4FodEFapAdlI14Hz2KDpPS8T"), true); } catch(e){} }
var auth=firebase.auth(), db=firebase.firestore();
var log=document.getElementById("log");
function L(s){ log.textContent+=s+"\n"; }
auth.getRedirectResult().catch(function(e){ L("LOGIN ERR: "+e.message); });
auth.onAuthStateChanged(function(u){
  document.getElementById("who").textContent = u ? ("Signed in: "+u.email+" ("+u.uid+")") : "Not signed in.";
  document.getElementById("btnDel").disabled = !u;
  document.getElementById("btnLogin").style.display = u ? "none" : "";
});
document.getElementById("btnLogin").addEventListener("click",function(){
  this.disabled=true; this.textContent="Google sign-in-এ যাচ্ছে…";
  auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()).catch(function(e){ L("LOGIN ERR: "+e.message); });
});
document.getElementById("btnDel").addEventListener("click",async function(){
  this.disabled=true;
  var cu = auth.currentUser; L("ACTING UID: " + (cu ? cu.uid : "NONE"));
  var ids=["ssc-m-01","ssc-m-02","ssc-m-03","ssc-m-04","ssc-m-05","ssc-m-06"], ok=0, fail=0;
  for (var i=0;i<ids.length;i++){
    try{ await db.collection("exams").doc(ids[i]).delete(); ok++; L("DELETED "+ids[i]); }
    catch(e){ fail++; L("FAIL "+ids[i]+": "+e.message); }
  }
  L("DONE ok="+ok+" fail="+fail);
});
</script>
</body></html>
