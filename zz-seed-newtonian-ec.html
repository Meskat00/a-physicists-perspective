?\", \"opts\": [\"\\\\(5.42\\\\text{ N}\\\\cdot\\\\text{m}\\\\)\", \"\\\\(7.211\\\\text{ N}\\\\cdot\\\\text{m}\\\\)\", \"\\\\(9.81\\\\text{ N}\\\\cdot\\\\text{m}\\\\)\", \"\\\\(14.42\\\\text{ N}\\\\cdot\\\\text{m}\\\\)\"], \"ans\": 1, \"why\": \"\\\\(\\\\vec{\\\\tau} = \\\\vec{r} \\\\times \\\\vec{F} = \\\\begin{vmatrix} \\\\hat{i} & \\\\hat{j} & \\\\hat{k} \\\\\\\\ 4 & -6 & 12 \\\\\\\\ 2 & -3 & 5 \\\\end{vmatrix} = 6\\\\hat{i} + 4\\\\hat{j} + 0\\\\hat{k}\\\\)। \\\\(\\\\vert{}\\\\vec{\\\\tau}\\\\vert{} = \\\\sqrt{6^2 + 4^2} = \\\\sqrt{52} \\\\approx 7.211\\\\text{ N}\\\\cdot\\\\text{m}\\\\)।\"}, {\"q\": \"একটি ফ্যানের ভর \\\\(8\\\\text{ kg}\\\\) এবং চক্রগতির ব্যাসার্ধ \\\\(0.06\\\\text{ m}\\\\)। সুইচ অন করার \\\\(10\\\\text{ s}\\\\) পর এটি \\\\(5\\\\pi\\\\text{ rad}\\\\cdot\\\\text{s}^{-1}\\\\) কৌণিক বেগ প্রাপ্ত হলে, প্রযুক্ত বলের ভ্রামক (টর্ক) কত?\", \"opts\": [\"\\\\(0.0452\\\\text{ N}\\\\cdot\\\\text{m}\\\\)\", \"\\\\(0.452\\\\text{ N}\\\\cdot\\\\text{m}\\\\)\", \"\\\\(0.0905\\\\text{ N}\\\\cdot\\\\text{m}\\\\)\", \"\\\\(1.25\\\\text{ N}\\\\cdot\\\\text{m}\\\\)\"], \"ans\": 0, \"why\": \"\\\\(I = mk^2 = 8 \\\\times (0.06)^2 = 0.0288\\\\text{ kg}\\\\cdot\\\\text{m}^2\\\\)। কৌণিক ত্বরণ \\\\(\\\\alpha = \\\\frac{\\\\omega - \\\\omega_0}{t} = \\\\frac{5\\\\pi - 0}{10} = 0.5\\\\pi\\\\text{ rad}\\\\cdot\\\\text{s}^{-2}\\\\)। \\\\(\\\\tau = I\\\\alpha = 0.0288 \\\\times 0.5\\\\pi \\\\approx 0.0452\\\\text{ N}\\\\cdot\\\\text{m}\\\\)।\"}, {\"q\": \"একটি চাকার ভর \\\\(10\\\\text{ kg}\\\\), ব্যাসার্ধ \\\\(0.5\\\\text{ m}\\\\) এবং আদি কৌণিক বেগ \\\\(52.36\\\\text{ rad}\\\\cdot\\\\text{s}^{-1}\\\\)। \\\\(6855\\\\text{ N}\\\\cdot\\\\text{m}\\\\) বাধাদানকারী টর্ক প্রয়োগ করলে চাকাটি থামতে কত সময় লাগবে?\", \"opts\": [\"\\\\(10\\\\text{ s}\\\\)\", \"\\\\(5\\\\text{ s}\\\\)\", \"\\\\(0.0095\\\\text{ s}\\\\)\", \"\\\\(1.5\\\\text{ s}\\\\)\"], \"ans\": 2, \"why\": \"সিলিন্ডার/চাকতি হিসেবে \\\\(I = \\\\frac{1}{2}mr^2 = \\\\frac{1}{2}(10)(0.5)^2 = 1.25\\\\text{ kg}\\\\cdot\\\\text{m}^2\\\\)। ত্বরণ \\\\(\\\\alpha = \\\\frac{\\\\tau}{I} = \\\\frac{6855}{1.25} = 5484\\\\text{ rad}\\\\cdot\\\\text{s}^{-2}\\\\)। থামার সময় \\\\(t = \\\\frac{\\\\omega_0}{\\\\alpha} = \\\\frac{52.36}{5484} \\\\approx 0.0095\\\\text{ s}\\\\) (অর্থাৎ এটি এক সেকেন্ডেরও কম সময়ে থেমে যাবে)।\"}, {\"q\": \"ঘূর্ণন অক্ষ সাপেক্ষে কোনো বস্তুর জড়তার ভ্রামক \\\\(100\\\\text{ kg}\\\\cdot\\\\text{m}^2\\\\) এবং পর্যায়কাল \\\\(0.5\\\\text{ s}\\\\) হলে বস্তুটির কৌণিক ভরবেগ কত?\", \"opts\": [\"\\\\(628\\\\text{ kg}\\\\cdot\\\\text{m}^2\\\\text{s}^{-1}\\\\)\", \"\\\\(1256.64\\\\text{ kg}\\\\cdot\\\\text{m}^2\\\\text{s}^{-1}\\\\)\", \"\\\\(314\\\\text{ kg}\\\\cdot\\\\text{m}^2\\\\text{s}^{-1}\\\\)\", \"\\\\(2512\\\\text{ kg}\\\\cdot\\\\text{m}^2\\\\text{s}^{-1}\\\\)\"], \"ans\": 1, \"why\": \"\\\\(\\\\omega = \\\\frac{2\\\\pi}{T} = \\\\frac{2\\\\pi}{0.5} = 4\\\\pi\\\\text{ rad/s}\\\\)। কৌণিক ভরবেগ \\\\(L = I\\\\omega = 100 \\\\times 4\\\\pi \\\\approx 1256.64\\\\text{ kg}\\\\cdot\\\\text{m}^2\\\\text{s}^{-1}\\\\)।\"}, {\"q\": \"একটি কণার অবস্থান ভেক্টর \\\\(\\\\vec{r} = (2\\\\hat{i} + 4\\\\hat{j} + 3\\\\hat{k})\\\\) এবং রৈখিক ভরবেগ \\\\(\\\\vec{P} = (2\\\\hat{i} - 3\\\\hat{j} + 4\\\\hat{k})\\\\) হলে, কণাটির কৌণিক ভরবেগ কত?\", \"opts\": [\"\\\\(25\\\\hat{i} - 2\\\\hat{j} - 14\\\\hat{k}\\\\)\", \"\\\\(25\\\\hat{i} + 2\\\\hat{j} + 14\\\\hat{k}\\\\)\", \"\\\\(-25\\\\hat{i} + 2\\\\hat{j} - 14\\\\hat{k}\\\\)\", \"\\\\(7\\\\hat{i} - 2\\\\hat{j} - 14\\\\hat{k}\\\\)\"], \"ans\": 0, \"why\": \"\\\\(\\\\vec{L} = \\\\vec{r} \\\\times \\\\vec{P} = \\\\begin{vmatrix} \\\\hat{i} & \\\\hat{j} & \\\\hat{k} \\\\\\\\ 2 & 4 & 3 \\\\\\\\ 2 & -3 & 4 \\\\end{vmatrix} = \\\\hat{i}(16 - (-9)) - \\\\hat{j}(8 - 6) + \\\\hat{k}(-6 - 8) = 25\\\\hat{i} - 2\\\\hat{j} - 14\\\\hat{k}\\\\)।\"}, {\"q\": \"এক ব্যক্তি দুই হাত প্রসারিত করে \\\\(30\\\\text{ rpm}\\\\) বেগে ঘুরছেন। হাত গুটিয়ে জড়তার ভ্রামক পূর্বের তুলনায় \\\\(5\\\\) গুণ কমালে (অর্থাৎ \\\\(\\\\frac{1}{5}\\\\) অংশ করলে) নতুন ঘূর্ণন বেগ কত হবে?\", \"opts\": [\"\\\\(6\\\\text{ rpm}\\\\)\", \"\\\\(60\\\\text{ rpm}\\\\)\", \"\\\\(150\\\\text{ rpm}\\\\)\", \"\\\\(75\\\\text{ rpm}\\\\)\"], \"ans\": 2, \"why\": \"কৌণিক ভরবেগের সংরক্ষণশীলতা নীতি অনুযায়ী: \\\\(I_1 \\\\omega_1 = I_2 \\\\omega_2 \\\\implies I_1(30) = \\\\left(\\\\frac{I_1}{5}\\\\right)\\\\omega_2 \\\\implies \\\\omega_2 = 30 \\\\times 5 = 150\\\\text{ rpm}\\\\)।\"}]"};
