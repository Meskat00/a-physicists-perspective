\"ans\": 0, \"why\": \"গৌণ কুণ্ডলীর পাক সংখ্যা বেশি হলে বিভব বাড়ে, অর্থাৎ এটি স্টেপ-আপ ট্রান্সফর্মার।\"}, {\"q\": \"পানি ও কাঁচের প্রতিসরাঙ্ক যথাক্রমে 1.33 ও 1.5। পানিতে আলোর বেগ \\\\(2.28 \\\\times 10^{8}\\\\,ms^{-1}\\\\) হলে, কাঁচে আলোর বেগ কত? [BSMRSTU 18-19]\", \"opts\": [\"\\\\(2.0 \\\\times 10^{8}\\\\,ms^{-1}\\\\)\", \"\\\\(2.3 \\\\times 10^{8}\\\\,ms^{-1}\\\\)\", \"\\\\(2.56 \\\\times 10^{8}\\\\,ms^{-1}\\\\)\", \"\\\\(2.8 \\\\times 10^{8}\\\\,ms^{-1}\\\\)\"], \"ans\": 0, \"why\": \"আলোর বেগ প্রতিসরাঙ্কের ব্যস্তানুপাতিক: \\\\(v_{glass} = 2.28 \\\\times 10^{8} \\\\times \\\\frac{1.33}{1.5} \\\\approx 2.0 \\\\times 10^{8}\\\\,ms^{-1}\\\\)।\"}, {\"q\": \"একটি আলোকরশ্মি কোনো মাধ্যম থেকে 1.59 পরম প্রতিসরাঙ্কের অন্য মাধ্যমে প্রবেশ করায় বেগের মান এক-দশমাংশ কমে গেল। ১ম মাধ্যমের পরম প্রতিসরাঙ্ক কত? [BSMRSTU 18-19]\", \"opts\": [\"1.10\", \"1.35\", \"1.45\", \"1.67\"], \"ans\": 1, \"why\": \"বেগ এক-দশমাংশ কমায় \\\\(v_2 = 0.9v_1\\\\), ফলে \\\\(\\\\mu_1 = 0.9 \\\\times 1.59 \\\\approx 1.43\\\\) হওয়ার কথা; বইয়ের উত্তর 1.35।\"}, {\"q\": \"\\\\(27\\\\,cm\\\\) ফোকাস দৈর্ঘ্য বিশিষ্ট একটি অবতল দর্পণ থেকে কত দূরত্বে একটি বস্তুকে রাখলে প্রতিবিম্বের দৈর্ঘ্য তার দৈর্ঘ্যের তিন গুণ হবে? [BSMRSTU 18-19]\", \"opts\": [\"18 cm\", \"36 cm\", \"27 cm\", \"81 cm\"], \"ans\": 1, \"why\": \"বাস্তব বিম্বের ক্ষেত্রে বিবর্ধন \\\\(m = \\\\frac{v}{u} = 3\\\\); দর্পণের সূত্র থেকে \\\\(u = \\\\frac{m+1}{m}f = \\\\frac{4}{3} \\\\times 27 = 36\\\\,cm\\\\)।\"}, {\"q\": \"কাচের প্রতিসরাঙ্ক 1.52 হলে, কাচের মধ্যে আলোর বেগ- [BSMRSTU 18-19]\", \"opts\": [\"\\\\(3 \\\\times 10^{8}\\\\,m/s\\\\)\", \"\\\\(2 \\\\times 10^{8}\\\\,m/s\\\\)\", \"\\\\(1.97 \\\\times 10^{8}\\\\,m/s\\\\)\", \"\\\\(1.5 \\\\times 10^{8}\\\\,m/s\\\\)\"], \"ans\": 2, \"why\": \"\\\\(v = \\\\frac{3 \\\\times 10^{8}}{1.52} \\\\approx 1.97 \\\\times 10^{8}\\\\,m/s\\\\)।\"}, {\"q\": \"বাতাসে কাচের সংকট কোণ \\\\(41.8^{\\\\circ}\\\\)। পানিতে ডুবানো অবস্থায় কাচের সংকট কোণ কত? [BSMRSTU 18-19]\", \"opts\": [\"\\\\(63^{\\\\circ}\\\\)\", \"\\\\(51^{\\\\circ}\\\\)\", \"\\\\(62^{\\\\circ}\\\\)\", \"\\\\(60^{\\\\circ}\\\\)\"], \"ans\": 0, \"why\": \"\\\\(\\\\mu_g = \\\\frac{1}{\\\\sin 41.8^{\\\\circ}} \\\\approx 1.50\\\\); পানির সাপেক্ষে সংকট কোণ \\\\(\\\\sin\\\\theta_c = \\\\frac{\\\\mu_w}{\\\\mu_g}\\\\) দিয়ে নির্ণয় করা হয়।\"}, {\"q\": \"কাচ উপাদানের প্রতিসরাঙ্ক 0.5 হলে, একটি কাচ স্ল্যাবের সংকট কোণ কত হবে? [BSMRSTU 18-19]\", \"opts\": [\"\\\\(\\\\frac{\\\\pi}{4}\\\\)\", \"\\\\(\\\\frac{\\\\pi}{3}\\\\)\", \"\\\\(\\\\frac{\\\\pi}{2}\\\\)\", \"\\\\(\\\\frac{\\\\pi}{6}\\\\)\"], \"ans\": 3, \"why\": \"বইয়ের হিসাবে \\\\(\\\\theta_c = \\\\sin^{-1}(0.5) = 30^{\\\\circ} = \\\\frac{\\\\pi}{6}\\\\)।\"}, {\"q\": \"ইয়ং এর দ্বি-চিড় পরীক্ষায়, চিড় দুইটির দূরত্ব অর্ধেক এবং চিড় থেকে পর্দার দূরত্ব তিনগুণ করলে, ডোরার মান ব্যবধান কত হবে? [BSMRSTU 18-19]\", \"opts\": [\"একই\", \"দ্বিগুণ\", \"চার গুণ\", \"ছয় গুণ\"], \"ans\": 3, \"why\": \"\\\\(\\\\beta \\\\propto D/d\\\\); \\\\(D\\\\) তিনগুণ ও \\\\(d\\\\) অর্ধেক হলে \\\\(\\\\beta\\\\) বাড়ে \\\\(3 \\\\div \\\\frac{1}{2} = 6\\\\) গুণ।\"}, {\"q\": \"আলোর তড়িৎচুম্বকীয় তত্ত্বের সাহায্যে কোনটি ব্যাখ্যা করা যায়? [BSMRSTU 18-19]\", \"opts\": [\"সমবর্তন\", \"আলোক তড়িৎ নিঃসরণ\", \"প্রতিসরণ\", \"অপবর্তন\"], \"ans\": 0, \"why\": \"তড়িৎচুম্বকীয় তত্ত্ব অনুযায়ী আলো অনুপ্রস্থ তরঙ্গ — এই ধারণা থেকে সমবর্তন ব্যাখ্যা করা যায় (বইয়ের চিহ্নিত উত্তর)।\"}, {\"q\": \"একটি ট্রেন আলোর দ্রুতির কত গুণ দ্রুতিতে চললে এর চলমান দৈর্ঘ্য নিশ্চল দৈর্ঘ্যের 0.5 গুণ হবে? [BSMRSTU 18-19]\", \"opts\": [\"0.866\", \"0.254\", \"0.236\", \"0.50\"], \"ans\": 0, \"why\": \"\\\\(L=L_0\\\\sqrt{1-v^2/c^2}=0.5L_0\\\\) থেকে \\\\(v=\\\\frac{\\\\sqrt{3}}{2}c\\\\approx0.866c\\\\)।\"}, {\"q\": \"একটি গাড়ি 0.1c বেগে রাস্তায় দাঁড়ানো একজন পর্যবেক্ষকের সাপেক্ষে চলমান। গাড়ির হেডলাইট থেকে নির্গত আলোর বেগ ঐ পর্যবেক্ষকের সাপেক্ষে কত? [BSMRSTU 18-19]\", \"opts\": [\"1.1c\", \"0.9c\", \"c\", \"2c\"], \"ans\": 2, \"why\": \"আইনস্টাইনের স্বীকার্য অনুযায়ী আলোর বেগ সব পর্যবেক্ষকের সাপেক্ষে ধ্রুবক c।\"}, {\"q\": \"কালো বর্ণের বস্তুর তাপমাত্রা দ্বিগুণ বৃদ্ধি করলে বিকিরণ হার কতগুণ বৃদ্ধি পাবে? [BSMRSTU 18-19]\", \"opts\": [\"2\", \"4\", \"16\", \"8\"], \"ans\": 2, \"why\": \"স্টিফান-বোল্টজম্যান সূত্রে বিকিরণ হার \\\\(\\\\propto T^4\\\\); তাপমাত্রা দ্বিগুণ হলে \\\\(2^4=16\\\\) গুণ।\"}, {\"q\": \"একটি আলফা কণার পুরো ভরকে শক্তিতে রূপান্তরিত করা হলে কী পরিমাণ শক্তি উৎপন্ন হবে? [BSMRSTU 18-19]\", \"opts\": [\"3.7 GeV\", \"3.7 MeV\", \"3.7 eV\", \"7.8 eV\"], \"ans\": 0, \"why\": \"আলফা কণার ভর \\\\(\\\\approx4\\\\) amu; \\\\(E\\\\approx4\\\\times931.5\\\\approx3.7\\\\) GeV।\"}, {\"q\": \"\\\\(1\\\\) a.m.u সমান কত MeV? [BSMRSTU 18-19]\", \"opts\": [\"934 MeV\", \"1000 MeV\", \"800 MeV\", \"950 MeV\"], \"ans\": 0, \"why\": \"\\\\(1\\\\) amu-এর শক্তি সমতুল্য \\\\(\\\\approx931.5\\\\) MeV; বইয়ের নিকটতম উত্তর 934 MeV।\"}, {\"q\": \"একটি তেজস্ক্রিয় পদার্থের অর্ধায়ু 1600 বছর। কত সময় উক্ত পদার্থের 15/16 অংশ ক্ষয়প্রাপ্ত হবে? [BSMRSTU 18-19]\", \"opts\": [\"1500 years\", \"4800 years\", \"6400 years\", \"9600 years\"], \"ans\": 2, \"why\": \"15/16 অংশ ক্ষয় মানে 1/16 অংশ অবশিষ্ট \\\\(= (1/2)^4\\\\), অর্থাৎ 4 অর্ধায়ু \\\\(= 4\\\\times1600 = 6400\\\\) বছর।\"}, {\"q\": \"কোন Radioactive পদার্থের ক্ষয় ধ্রুবকের মান \\\\(3465\\\\times10^{-4}\\\\, \\\\mathrm{s^{-1}}\\\\) হলে, অর্ধজীবন কত? [BSMRSTU 18-19]\", \"opts\": [\"5s\", \"4s\", \"2s\", \"8ms\"], \"ans\": 2, \"why\": \"\\\\(T_{1/2} = 0.693/\\\\lambda = 0.693/0.3465 = 2\\\\) s।\"}, {\"q\": \"একটি ট্রানজিস্টর সাধারণ পিঠ সংযোগে আছে। এর নিঃসারক প্রবাহ 0.85 mA এবং পিঠ প্রবাহ 0.05 mA হলে প্রবাহ বিবর্ধক গুণক কত? [BSMRSTU 18-19]\", \"opts\": [\"0.94\", \"0.84\", \"0.88\", \"1.0\"], \"ans\": 0, \"why\": \"\\\\(\\\\alpha = \\\\frac{I_E - I_B}{I_E} = \\\\frac{0.85-0.05}{0.85} \\\\approx 0.94\\\\)।\"}, {\"q\": \"দ্বিমিক সংখ্যা 1111111 কে দ্বিমিক সংখ্যা 101 দ্বারা ভাগ করলে ভাগশেষ - [BSMRSTU 18-19]\", \"opts\": [\"0\", \"10\", \"11\", \"100\"], \"ans\": 1, \"why\": \"\\\\(1111111_2 = 127\\\\) এবং \\\\(101_2 = 5\\\\); \\\\(127 = 25 \\\\times 5 + 2\\\\), ভাগশেষ \\\\(2 = 10_2\\\\)।\"}, {\"q\": \"1D বা একমাত্রিক ন্যানো পার্টিকেলের কয়টি মাত্রা ন্যানো স্কেলে থাকে? [BSMRSTU 18-19]\", \"opts\": [\"1 টি\", \"2 টি\", \"3 টি\", \"4 টি\"], \"ans\": 0, \"why\": \"বইয়ের শ্রেণিবিন্যাস অনুযায়ী একমাত্রিক ন্যানো কণার একটি মাত্রা ন্যানো স্কেলে থাকে।\"}, {\"q\": \"একটি BJT ট্রানজিস্টর এর ক্ষেত্রে \\\\(I_C = 10\\\\,\\\\text{mA}\\\\), \\\\(I_E = 15\\\\,\\\\text{mA}\\\\) হলে, ওই ট্রানজিস্টরের প্রবাহ লাভ এর মান কত? [BSMRSTU 18-19]\", \"opts\": [\"1.5\", \".67\", \"2\", \".5\"], \"ans\": 1, \"why\": \"প্রবাহ লাভ \\\\(\\\\alpha = I_C/I_E = 10/15 \\\\approx 0.67\\\\)।\"}, {\"q\": \"একটি ট্রানজিস্টরের কারেন্ট গেইন ও amplification factor এর অনুপাত ১০০:১। নিঃসারক প্রবাহ 200 এম্পিয়ার হলে পীঠ প্রবাহ কত? [BSMRSTU 18-19]\", \"opts\": [\"4A\", \"6A\", \"2A\", \"5A\"], \"ans\": 2, \"why\": \"অনুপাত অনুযায়ী পীঠ প্রবাহ \\\\(= 200/100 = 2\\\\,\\\\text{A}\\\\) (বইয়ের উত্তর)।\"}, {\"q\": \"একটি BJT এর জন্য \\\\(\\\\alpha = 0.9\\\\) হলে, \\\\(\\\\beta\\\\) এর মান কত হবে? [BSMRSTU 18-19]\", \"opts\": [\"9\", \"95\", \"100\", \"90\"], \"ans\": 0, \"why\": \"\\\\(\\\\beta = \\\\frac{\\\\alpha}{1-\\\\alpha} = \\\\frac{0.9}{0.1} = 9\\\\)।\"}, {\"q\": \"নক্ষত্রের মধ্যে কি বিক্রিয়া ঘটে? [BSMRSTU 18-19]\", \"opts\": [\"নিউক্লিয়ার ফিশন\", \"নিউক্লিয়ার ফিউশন\", \"রাসায়নিক বিক্রিয়া\", \"ফটোইলেকট্রিক ইফেক্ট\"], \"ans\": 1, \"why\": \"নক্ষত্রের কেন্দ্রে হালকা নিউক্লিয়াস মিলিত হয়ে ভারী নিউক্লিয়াস গঠনের ফিউশন বিক্রিয়ায় বিপুল শক্তি নির্গত হয়।\"}]"},"adm-buet-ch-modern-physics":{"title":"বহুনির্বাচনি পরীক্ষা — বুয়েট অধ্যায়ভিত্তিক: আধুনিক পদার্থবিজ্ঞানের সূচনা","chapter":"Admission","level":"বুয়েট","minutes":46,"qjson":"[{\"q\": \"\\\\(2.3\\\\ \\\\mathrm{eV}\\\\) কার্যপেক্ষক বিশিষ্ট ধাতুতে \\\\(3000\\\\ \\\\text{Å}\\\\) তরঙ্গদৈর্ঘ্যের আলো আপতিত হলে নির্গত ইলেকট্রনের সর্বোচ্চ গতিশক্তি কত? [BUET Preli 23-24]\", \"opts\": [\"\\\\(4.14\\\\ \\\\mathrm{eV}\\\\)\", \"\\\\(1.84\\\\ \\\\mathrm{eV}\\\\)\", \"\\\\(6.44\\\\ \\\\mathrm{eV}\\\\)\", \"\\\\(3.4\\\\ \\\\mathrm{eV}\\\\)\"], \"ans\": 1, \"why\": \"\\\\(E_k = \\\\frac{hc}{\\\\lambda} - W_0 = \\\\frac{12400}{3000} - 2.3 = 4.14 - 2.3 = 1.84\\\\ \\\\mathrm{eV}\\\\)\"}, {\"q\": \"একটি স্থির বস্তু ভেঙে \\\\(1\\\\ \\\\mathrm{kg}\\\\) ভরের দুটি বস্তু \\\\(0.6c\\\\) বেগে দুদিকে ছড়িয়ে পড়ে। আদি বস্তুর ভর কত ছিল? [BUET Preli 23-24]\", \"opts\": [\"\\\\(3.2\\\\ \\\\mathrm{kg}\\\\)\", \"\\\\(1.2\\\\ \\\\mathrm{kg}\\\\)\", \"\\\\(2\\\\ \\\\mathrm{kg}\\\\)\", \"\\\\(2.5\\\\ \\\\mathrm{kg}\\\\)\"], \"ans\": 3, \"why\": \"শক্তি সংরক্ষণে \\\\(Mc^2 = 2\\\\gamma mc^2\\\\); \\\\(\\\\gamma = \\\\frac{1}{\\\\sqrt{1 - 0.6^2}} = 1.25\\\\) → \\\\(M = 2 \\\\times 1.25 \\\\times 1 = 2.5\\\\ \\\\mathrm{kg}\\\\)\"}, {\"q\": \"তরঙ্গদৈর্ঘ্যের সঠিক ক্রম কোনটি? [BUET Preli 23-24]\", \"opts\": [\"Micro > Radio > UV > γ\", \"γ > UV > Micro > Radio\", \"Radio > Micro > γ > UV\", \"Radio > Micro > UV > γ-ray\"], \"ans\": 3, \"why\": \"তড়িৎচুম্বকীয় বর্ণালিতে তরঙ্গদৈর্ঘ্য সবচেয়ে বেশি Radio তরঙ্গের, তারপর Micro, UV এবং সবচেয়ে কম γ-ray এর।\"}, {\"q\": \"পৃথিবীতে একটি তেজস্ক্রিয় পদার্থের অবক্ষয় ধ্রুবক \\\\(4.02 \\\\times 10^{-4}\\\\ \\\\mathrm{yr^{-1}}\\\\) হলে, \\\\(0.9c\\\\) বেগে চলমান মহাকাশযানে তেজস্ক্রিয় পদার্থটির অবক্ষয় ধ্রুবক কত? [BUET Preli 23-24]\", \"opts\": [\"\\\\(2.83 \\\\times 10^{-4}\\\\ \\\\mathrm{yr^{-1}}\\\\)\", \"\\\\(1.75 \\\\times 10^{-4}\\\\ \\\\mathrm{yr^{-1}}\\\\)\", \"\\\\(2.25 \\\\times 10^{-4}\\\\ \\\\mathrm{yr^{-1}}\\\\)\", \"\\\\(3.75 \\\\times 10^{-4}\\\\ \\\\mathrm{yr^{-1}}\\\\)\"], \"ans\": 1, \"why\": \"কাল প্রসারণে অর্ধায়ু বেড়ে যায়, তাই \\\\(\\\\lambda' = \\\\lambda\\\\sqrt{1 - 0.9^2} = 4.02 \\\\times 10^{-4} \\\\times 0.436 = 1.75 \\\\times 10^{-4}\\\\ \\\\mathrm{yr^{-1}}\\\\)\"}, {\"q\": \"\\\\(0.8c\\\\) বেগে চলমান রকেট থেকে মিটার স্কেলের দৈর্ঘ্য কত হবে? [BUET Preli 22-23]\", \"opts\": [\"\\\\(0.8\\\\ \\\\mathrm{m}\\\\)\", \"\\\\(0.7\\\\ \\\\mathrm{m}\\\\)\", \"\\\\(0.6\\\\ \\\\mathrm{m}\\\\)\", \"\\\\(0.4\\\\ \\\\mathrm{m}\\\\)\"], \"ans\": 2, \"why\": \"দৈর্ঘ্য সংকোচনে \\\\(L = L_0\\\\sqrt{1 - \\\\frac{v^2}{c^2}} = \\\\sqrt{1 - 0.8^2} = 0.6\\\\ \\\\mathrm{m}\\\\)\"}, {\"q\": \"কোনো বস্তুর গতিশক্তি, এর নিশ্চল শক্তির 3 গুণ হলে \\\\(m\\\\) ও \\\\(m_0\\\\) এর সম্পর্ক কোনটি? [BUET Preli 22-23]\", \"opts\": [\"\\\\(m = 4m_0\\\\)\", \"\\\\(m = 3m_0\\\\)\", \"\\\\(m = 2m_0\\\\)\", \"\\\\(m = m_0\\\\)\"], \"ans\": 0, \"why\": \"\\\\(E_k = (m - m_0)c^2 = 3m_0c^2\\\\) ⇒ \\\\(m - m_0 = 3m_0\\\\) ⇒ \\\\(m = 4m_0\\\\)।\"}, {\"q\": \"একটি নিশ্চল ইলেকট্রন 0.98c বেগে গতিশীল হলে তার ভর কত শতাংশ বৃদ্ধি পাবে? [BUET Preli 21-22]\", \"opts\": [\"457\", \"407\", \"721\", \"615\"], \"ans\": 1, \"why\": \"\\\\(\\\\frac{m - m_0}{m_0} \\\\times 100\\\\% = \\\\left(\\\\frac{1}{\\\\sqrt{1 - 0.98^2}} - 1\\\\right) \\\\times 100\\\\% \\\\approx 403\\\\%\\\\), যা সবচেয়ে কাছের option 407।\"}, {\"q\": \"জড় প্রসঙ্গ কাঠামোর ক্ষেত্রে সত্য কোনটি? [BUET Preli 21-22]\", \"opts\": [\"নিউটনীয় গতিসূত্র মানে\", \"অসম বেগে চলে\", \"জড়তার সূত্র মানে না\", \"ত্বরণ আছে\"], \"ans\": 0, \"why\": \"জড় প্রসঙ্গ কাঠামো ত্বরণহীন (স্থির বা সমবেগে চলমান) এবং সেখানে নিউটনের গতিসূত্রগুলো প্রযোজ্য।\"}, {\"q\": \"\\\\(4000\\\\,\\\\text{kV}\\\\) বিভব পার্থক্যের মধ্য দিয়ে একটি ইলেকট্রনকে ত্বরিত করা হলো। গতিশীল অবস্থায় ইলেকট্রনটির ভর কত? [BUET 21-22]\", \"opts\": [\"\\\\(9.11\\\\times10^{-31}\\\\ \\\\text{kg}\\\\)\", \"\\\\(7.11\\\\times10^{-30}\\\\ \\\\text{kg}\\\\)\", \"\\\\(8.02\\\\times10^{-30}\\\\ \\\\text{kg}\\\\)\", \"\\\\(8.02\\\\times10^{-29}\\\\ \\\\text{kg}\\\\)\"], \"ans\": 2, \"why\": \"\\\\(E_k=(m-m_0)c^2 \\\\Rightarrow m=m_0+\\\\frac{eV}{c^2}=9.11\\\\times10^{-31}+\\\\frac{4\\\\times10^6\\\\times1.6\\\\times10^{-19}}{(3\\\\times10^8)^2}=8.02\\\\times10^{-30}\\\\ \\\\text{kg}\\\\)।\"}, {\"q\": \"\\\\(4000\\\\,\\\\text{kV}\\\\) বিভব পার্থক্যের মধ্য দিয়ে ত্বরিত একটি ইলেকট্রনের বেগ কত? [BUET 21-22]\", \"opts\": [\"\\\\(1.50\\\\times10^{8}\\\\ \\\\text{m/s}\\\\)\", \"\\\\(2.98\\\\times10^{8}\\\\ \\\\text{m/s}\\\\)\", \"\\\\(2.65\\\\times10^{8}\\\\ \\\\text{m/s}\\\\)\", .83 s\", \"2.3 s\", \"1.43 s\", \"2.86 s\"], \"ans\": 3, \"why\": \"t = 2u/g = 2×14/9.8 ≈ 2.86 s।\"}, {\"q\": \"অনুভূমিকের সাথে \\\\(45^\\\\circ\\\\) কোণে নিক্ষিপ্ত একটি বস্তুর অনুভূমিক পাল্লা 100m। এর সর্বোচ্চ উচ্চতা- [IU 19-20]\", \"opts\": [\"17.68 m\", \"14.43 m\", \"25.00 m\", \"43.00 m\"], \"ans\": 2, \"why\": \"45° নিক্ষেপে সর্বোচ্চ উচ্চতা = পাল্লা/4 = 100/4 = 25 m।\"}, {\"q\": \"একটি বস্তুকে 30 m উঁচু কোনো বিল্ডিং এর ছাদ থেকে ভূমির সমান্তরালে \\\\(10\\\\,ms^{-1}\\\\) বেগে নিক্ষেপ করা হলো। বস্তুটি কতক্ষণ পর মাটিতে আঘাত করবে? [BSMRSTU 19-20]\", \"opts\": [\"3 s\", \"10 s\", \"30 s\", \"2.4 s\"], \"ans\": 3, \"why\": \"t = √(2h/g) = √(60/9.8) ≈ 2.4 s।\"}, {\"q\": \"একজন ক্রিকেটার একটি বলকে সর্বোচ্চ 100m আনুভূমিক দূরত্বে ছাড়তে পারে। একই বলকে ক্রিকেটার মাটি থেকে কত m উচ্চতায় ছুড়তে পারবে? [JUST 19-20]\", \"opts\": [\"60\", \"none\", \"50\", \"70\"], \"ans\": 1, \"why\": \"বইয়ের চিহ্নিত উত্তর 'none'; কিন্তু সঠিক হিসাব: সর্বোচ্চ পাল্লা u²/g = 100, উল্লম্ব নিক্ষেপে উচ্চতা = u²/2g = 50 m (অপশন C) — বইয়ের উত্তরে ত্রুটি।\"}, {\"q\": \"একক উচ্চতার একজন ব্যক্তি \\\\(z = 10\\\\sin 2\\\\pi x\\\\) গ্রাফ ধরে x-অক্ষ বরাবর মূলবিন্দু নূন্যতম কত দূরত্ব গেলে বিস্তার ও লোকটির উচ্চতা সমান হবে? [BSMRSTU 19-20]\", \"opts\": [\"\\\\(\\\\pi\\\\)\", \"\\\\(\\\\pi/3\\\\)\", \"\\\\(1/12\\\\)\", \"blank\"], \"ans\": 3, \"why\": \"বইয়ের চিহ্নিত উত্তর অপশন D, যা বইয়ে আক্ষরিক 'blank' ছাপা — প্রশ্ন/অপশন ত্রুটিপূর্ণ।\"}, {\"q\": \"একটি প্রাসের তাৎক্ষণিক বেগের অভিমুখ বিচরণ পথের- [IU 19-20]\", \"opts\": [\"উলম্ব বরাবর\", \"স্পর্শক বরাবর\", \"অনুভূমিক বরাবর\", \"সমান্তরাল বরাবর\"], \"ans\": 1, \"why\": \"প্রাসের তাৎক্ষণিক বেগ সবসময় গতিপথের স্পর্শক বরাবর থাকে।\"}, {\"q\": \"যদি কোনো বস্তুর সরণ এর সমীকরণ \\\\(y = 12t^3 + 50t^2 + 100\\\\) হয় তবে 10s এ তার ত্বরণ কত হবে? [BSMRSTU 18-19]\", \"opts\": [\"\\\\(720ms^{-2}\\\\)\", \"\\\\(750ms^{-2}\\\\)\", \"\\\\(820ms^{-2}\\\\)\", \"\\\\(500ms^{-2}\\\\)\"], \"ans\": 2, \"why\": \"a = d²y/dt² = 72t + 100; t = 10s এ a = 820 ms⁻²।\"}, {\"q\": \"একটি গ \(=mc^{2}-m_0c^{2}\\\\)।\"}, {\"q\": \"তড়িৎ চুম্বকীয় তরঙ্গ তাপ সৃষ্টিকারক হিসেবে কাজ করে কোনটিতে? [JU 20-21]\", \"opts\": [\"সৌরচুল্লীতে\", \"শিল্প কারখানায়\", \"মাইক্রোওভেনে\", \"ওয়্যারলেসে\"], \"ans\": 2, \"why\": \"মাইক্রোওয়েভ তড়িৎচুম্বকীয় তরঙ্গ খাবারের অণুকে কম্পিত করে তাপ সৃষ্টি করে, তাই মাইক্রোওভেনে ব্যবহৃত হয়।\"}, {\"q\": \"মেডিকেল ইমেজিং এ কোন রশ্মি ব্যবহৃত হয়? [JU 19-20]\", \"opts\": [\"IR রশ্মি\", \"UV রশ্মি\", \"রেডিও রশ্মি\", \"X-রশ্মি\"], \"ans\": 0, \"why\": \"মানবদেহ থেকে বিকিরিত IR রশ্মির মাত্রা দেহের তাপশক্তির সমানুপাতিক—এই ধর্ম কাজে লাগিয়ে মেডিকেল IR ইমেজিং (থার্মোগ্রাফ) দ্বারা তাপমাত্রা নির্ণয় করা হয়।\"}]"},"adm-kuet-2016-17":{"title":"বহুনির্বাচনি পরীক্ষা — KUET ২০১৬-১৭","chapter":"Admission","level":"KUET (খুলনা প্রকৌশল ও প্রযুক্তি বিশ্ববিদ্যালয়)","minutes":25,"neg":0.25,"qjson":"[{\"q\": \"যদি \\\\(\\\\vec{P} = 2\\\\hat{i} + 4\\\\hat{j} - 5\\\\hat{k}\\\\) এবং \\\\(\\\\vec{Q} = -\\\\hat{i} + 2\\\\hat{j} + 3\\\\hat{k}\\\\) হলে \\\\(\\\\vec{P}\\\\) এবং \\\\(\\\\vec{Q}\\\\) এর মধ্যবর্তী কোণ কত? [KUET 2016-17]\", \"opts\": [\"\\\\(111.01^\\\\circ\\\\)\", \"\\\\(110.49^\\\\circ\\\\)\", \"\\\\(101.49^\\\\circ\\\\)\", \"\\\\(69^\\\\circ\\\\)\", \"\\\\(68.98^\\\\circ\\\\)\"], \"ans\": 0, \"why\": \"ডট গুণফল \\\\(\\\\vec{P}\\\\cdot\\\\vec{Q} = -9\\\\) এবং মানদ্বয়ের গুণফল \\\\(\\\\sqrt{45}\\\\sqrt{14}\\\\); এ থেকে \\\\(\\\\cos\\\\theta\\\\) বের করলে কোণটি প্রায় \\\\(111.01^\\\\circ\\\\) পাওয়া যায়।\"}, {\"q\": \"50gm ভর বিশিষ্ট একটি বস্তুকে 3m দীর্ঘ সুতার সাহায্যে বৃত্তাকার পথে ঘুরানো হচ্ছে। বস্তুটি 5 সেকেন্ডে 20 টি পূর্ণ আবর্তন করলে সুতার টান কত? [KUET 2016-17]\", \"opts\": [\"0.947 N\", \"9.47 N\", \"20 N\", \"50 N\", \"94.75 N\"], \"ans\": 4, \"why\": \"আবর্তন হার থেকে কৌণিক বেগ বের করে কেন্দ্রমুখী বল \\\\(T = m\\\\omega^2 r\\\\) প্রয়োগ করলে টান প্রায় 94.75 N হয়।\"}, {\"q\": \"একটি বস্তু স্থির অবস্থায় ছিল। 16N এর একটি বল এর উপর 5 সেকেন্ড ধরে কাজ করে এবং তারপর আর কোন কাজ করল না। বস্তুটি এর পর 6 সেকেন্ডে 52 মিটার দূরত্ব গেল। বস্তুটির  রাখতে পারবে? [KUET 2016-17]\", \"opts\": [\"2.0 cm\", \"1.64 cm\", \"1.58 cm\", \"1.5 cm\", \"1.48 cm\"], \"ans\": 1, \"why\": \"বিপরীত আধানের আকর্ষণ বল শোলার বলের ওজন mg-এর সমান হলে বলটি ঝুলে থাকে; কুলম্ব সূত্র থেকে দূরত্ব বের করলে 1.64 cm পাওয়া যায়।\"}, {\"q\": \"\\\\(100^\\\\circ\\\\mathrm{C}\\\\) তাপমাত্রার 1 kg পানিকে \\\\(0^\\\\circ\\\\mathrm{C}\\\\) তাপমাত্রার বরফে পরিণত করতে এন্ট্রপির পরিবর্তন কত হবে? [বরফ গলণের আপেক্ষিক সুপ্ততাপ = \\\\(336000 \\\\ \\\\mathrm{Jkg^{-1}}\\\\) এবং পানির আপেক্ষিক তাপ = \\\\(4200 \\\\ \\\\mathrm{Jkg^{-1}K^{-1}}\\\\)] [KUET 2016-17]\", \"opts\": [\"\\\\(-2541.6 \\\\ \\\\mathrm{JK^{-1}}\\\\)\", \"\\\\(-1310.85 \\\\ \\\\mathrm{JK^{-1}}\\\\)\", \"\\\\(-1230.77 \\\\ \\\\mathrm{JK^{-1}}\\\\)\", \"\\\\(1230.77 \\\\ \\\\mathrm{JK^{-1}}\\\\)\", \"\\\\(2541.6 \\\\ \\\\mathrm{JK^{-1}}\\\\)\"], \"ans\": 0, \"why\": \"পানি ঠান্ডা হওয়ার এন্ট্রপি হ্রাস ও \\\\(0^\\\\circ\\\\mathrm{C}\\\\)-এ জমাট বাঁধার এন্ট্রপি হ্রাস যোগ করলে মোট পরিবর্তন প্রায় \\\\(-2541.6 \\\\ \\\\mathrm{JK^{-1}}\\\\) হয়।\"}, {\"q\": \"\\\\(127^\\\\circ\\\\mathrm{C}\\\\) তাপমাত্রায় কোন নির্দিষ্ট পরিমাণ গ্যাস হঠাৎ সংকুচিত হয়ে \\\\(\\\\frac{1}{3}\\\\) আয়তন লাভ করে। তাপমাত্রার পরিবর্তন কত? [\\\\(\\\\gamma = 1.40\\\\)] [KUET 2016-17]\", \"opts\": [\"\\\\(620.74^\\\\circ\\\\mathrm{C}\\\\)\", \"\\\\(347.74^\\\\circ\\\\mathrm{C}\\\\)\", \"\\\\(220.74^\\\\circ\\\\mathrm{C}\\\\)\", \"\\\\(127^\\\\circ\\\\mathrm{C}\\\\)\", \"\\\\(-45^\\\\circ\\\\mathrm{C}\\\\)\"], \"ans\": 2, \"why\": \"হঠাৎ সংকোচন রুদ্ধতাপীয় ধরে \\\\(TV^{\\\\gamma-1} = \\\\) ধ্রুবক প্রয়োগ করলে শেষ তাপমাত্রা 620.74 K হয়, অর্থাৎ পরিবর্তন \\\\(220.74^\\\\circ\\\\mathrm{C}\\\\)।\"}, {\"q\": \"একটি বৈদ্যুতিক হিটার 220 ভোল্ট সরবরাহ লাইন থেকে 255 mA বিদ্যুৎ গ্রহণ করে। হিটারটি 700 ঘণ্টা ব্যবহার করলে কত শক্তি ব্যয় হবে? [KUET 2016-17]\", \"opts\": [\"3.9 kWh\", \"4 kWh\", \"26.4 kWh\", \"38.5 kWh\", \"39.27 kWh\"], \"ans\": 4, \"why\": \"ক্ষমতা \\\\(P = VI = 220  imes 0.255\\\\) W; 700 ঘণ্টার শক্তি \\\\(E = Pt\\\\) হিসাব করলে 39.27 kWh পাওয়া যায়।\"}, {\"q\": \"চৌম্বক ক্ষেত্রে x অক্ষ বরাবর \\\\(3 \\\\ \\\\mu\\\\mathrm{C}\\\\) আধানের একটি বস্তু \\\\(2 \\\\times 10^{6} \\\\mathrm{ms^{-1}}\\\\) বেগে চলছে। চৌম্বক ক্ষেত্র \\\\(\\\\vec{B} = (0.20\\\\hat{j} - 0.40\\\\hat{k})\\\\mathrm{T}\\\\) হলে আধানটির উপর ক্রিয়াশীল চৌম্বক বল কত? [KUET 2016-17]\", \"opts\": [\"\\\\((1.2\\\\hat{k} + 2.4\\\\hat{j})\\\\mathrm{N}\\\\)\", \"\\\\((0.8\\\\hat{k} - 1.6\\\\hat{j})\\\\mathrm{N}\\\\)\", \"\\\\((-1.2\\\\hat{k} + 2.4\\\\hat{j})\\\\mathrm{N}\\\\)\", \"\\\\((0.8\\\\hat{k} + 1.6\\\\hat{j})\\\\mathrm{N}\\\\)\", \"\\\\((-1.2\\\\hat{k} - 2.4\\\\hat{j})\\\\mathrm{N}\\\\)\"], \"ans\": 0, \"why\": \"\\\\(\\\\vec{F} = q(\\\\vec{v} \\\\times \\\\vec{B})\\\\) ক্রস গুণফল করলে \\\\(\\\\hat{j}\\\\) ও \\\\(\\\\hat{k}\\\\) উপাংশ যথাক্রমে 2.4 ও 1.2 আসে, যা বিকল্প (a)-এর সঙ্গে মিলে।\"}, {\"q\": \"কোন কুণ্ডলীতে 4 সেকেন্ড সময়ে তড়িৎ প্রবাহ 1 A থেকে 10 A এর পরিবর্তিত হওয়ার দরুণ ঐ কুণ্ডলীতে 120V তড়িচ্চালক শক্তি আবিষ্ট হয়। কুণ্ডলীর স্বকীয় আবেশ গুণাঙ্ক কত? [KUET 2016-17]\", \"opts\": [\"120 H\", \"53.3 H\", \"25 H\", \"5.33 H\", \"0.533 H\"], \"ans\": 1, \"why\": \"আবিষ্ট তড়িচ্চালক বল \\\\(\\\\varepsilon = L\\\\frac{\\\\Delta I}{\\\\Delta t}\\\\) থেকে \\\\(L = 120 \\\\times 4/(10-1) = 53.3\\\\) H পাওয়া যায়।\"}, {\"q\": \"ইয়াং এর দ্বি-চিড় পরীক্ষায় আলোর কম্পাঙ্ক হল \\\\(6.2 \\\\times 10^{14}\\\\mathrm{Hz}\\\\)। পার্শ্ববর্তী দুটি ডোরার কেন্দ্রের মধ্যবর্তী দূরত্ব 0.72 mm। পর্দাটি যদি 1.6m দূরে থাকে তাহলে চিড় দুটির মধ্যবর্তী দূরত্ব কত? [KUET 2016-17]\", \"opts\": [\"0.49 mm\", \"0.514 mm\", \"0.538 mm\", \"0.62 mm\", \"0.54 mm\"], \"ans\": 2, \"why\": \"কম্পাঙ্ক থেকে তরঙ্গদৈর্ঘ্য \\\\(\\\\lambda = c/f\\\\) বের করে ডোরা-প্রস্থ \\\\(x = \\\\lambda D/a\\\\) সম্পর্কটি a-এর জন্য সাজালে চিড় ব্যবধান 0.538 mm হয়।\"}, {\"q\": \"কোন যৌগিক অণুবীক্ষণ যন্ত্রে অভিলক্ষ্য ও অভিনেত্রের ফোকাস দূরত্ব 10cm ও 15cm। যদি অভিলক্ষ্য থেকে বাস্তব প্রতিবিম্বের দূরত্ব 50 cm হয় এবং অভিনেত্র থেকে অবাস্তব প্রতিবিম্বের দূরত্ব 60cm হয়, তবে ঐ অণুবীক্ষণ যন্ত্রের বিবর্ধন কত? [KUET 2016-17]\", \"opts\": [\"10\", \"15\", \"20\", \"50\", \"60\"], \"ans\": 2, \"why\": \"লেন্স সূত্রে দুটি ধাপের বস্তু-দূরত্ব বের করে বিবর্ধনদ্বয়ের গুণফল \\\\(4  imes 5 = 20\\\\) পাওয়া যায়।\"}, {\"q\": \"একটি ধাতব পৃষ্ঠ হতে নিঃসৃত ইলেকট্রনের সর্বাধিক বেগ কত হলে নিবৃত্ত বিভব পার্থক্য 0.96V হবে। [KUET 2016-17]\", \"opts\": [\"\\\\(8.21 \\\\times 10^{5} \\\\ \\\\mathrm{ms^{-1}}\\\\)\", \"\\\\(5.81 \\\\times 10^{5} \\\\ \\\\mathrm{ms^{-1}}\\\\)\", \"\\\\(5.72 \\\\times 10^{5} \\\\ \\\\mathrm{ms^{-1}}\\\\)\", \"\\\\(5.63 \\\\times 10^{5} \\\\ \\\\mathrm{ms^{-1}}\\\\)\", \"\\\\(4.28 \\\\times 10^{5} \\\\ \\\\mathrm{ms^{-1}}\\\\)\"], \"ans\": 1, \"why\": \"নিবৃত্ত বিভবে \\\\(eV_s = \\\\frac{1}{2}mv_{max}^2\\\\); এখান থেকে বেগ বের করলে প্রায় \\\\(5.81 \\\\times 10^{5} \\\\ \\\\mathrm{ms^{-1}}\\\\) পাওয়া যায়।\"}, {\"q\": \"রেডিয়াম এর অর্ধজীবন 1620 বছর। কত সময়ে 1 গ্রাম রেডিয়াম 1 সেন্টিগ্রাম এ পরিণত হবে? [KUET 2016-17]\", \"opts\": [\"\\\\(4.28 \\\\times 10^{-4} \\\\ \\\\mathrm{Y}\\\\)\", \"23.68 Y\", \"1600 Y\", \"5380 Y\", \"10767 Y\"], \"ans\": 4, \"why\": \"ভর 100 গুণ কমতে প্রয়োজনীয় সময় \\\\(t = \\\\frac{1620}{\\\\ln 2}\\\\ln 100\\\\), যা প্রায় 10767 বছর (বইয়ের সমাধানে 10763 Y)।\"}, {\"q\": \"একটি জলপ্রপাত 900 মিটার উঁচু। যদি ধরা হয় পতিত পানির গতিশক্তির অর্ধেক তাপে পরিণত হয়, তাহলে তাপমাত্রা বৃদ্ধি কত হবে? [KUET 2016-17]\", \"opts\": [\"\\\\(0.1^\\\\circ\\\\mathrm{C}\\\\)\", \"\\\\(0.53^\\\\circ\\\\mathrm{C}\\\\)\", \"\\\\(1^\\\\circ\\\\mathrm{C}\\\\)\", \"\\\\(1.05^\\\\circ\\\\mathrm{C}\\\\)\", \"\\\\(10.5^\\\\circ\\\\mathrm{C}\\\\)\"], \"ans\": 3, \"why\": \"\\\\(\\\\frac{1}{2}mgh = ms\\\\Delta\\\\theta\\\\) সম্পর্কে পানির আপেক্ষিক তাপ 4200 বসালে \\\\(\\\\Delta\\\\theta = \\\\frac{0.5 \\\\times 9.8 \\\\times 900}{4200} = 1.05^\\\\circ\\\\mathrm{C}\\\\) পাওয়া যায়।\"}, {\"q\": \"একজন ভদ্রমহিলা মহাশূন্যযানে চড়ে 4 আলোকবর্ষ দূরের একটি গ্রহে 0.9c বেগে যাবেন এবং ফিরে আসবেন। তার বয়স তার জমজ বোন (যিনি পৃথিবীতে ছিলেন) এর চেয {-1}}\\\\)।\"}, {\"q\": \"পৃথিবীতে একটি রকেটের দৈর্ঘ্য \\\\(110\\\\ \\\\mathrm{m}\\\\)। উড়ন্ত অবস্থায় রকেটটির দৈর্ঘ্য \\\\(108.5\\\\ \\\\mathrm{m}\\\\) হলে, রকেটের বেগ নির্ণয় কর। [KUET 2015-16]\", \"opts\": [\"\\\\(4.24\\\\times10^{7}\\\\ \\\\mathrm{ms^{-1}}\\\\)\", \"\\\\(4.94\\\\times10^{8}\\\\ \\\\mathrm{cms^{-1}}\\\\)\", \"\\\\(4.94\\\\times10^{7}\\\\ \\\\mathrm{ms^{-1}}\\\\)\", \"\\\\(5.2\\\\times10^{9}\\\\ \\\\mathrm{cms^{-1}}\\\\)\", \"\\\\(8.13\\\\times10^{8}\\\\ \\\\mathrm{cms^{-1}}\\\\)\"], \"ans\": 2, \"why\": \"দৈর্ঘ্য সংকোচন \\\\(L=L_0\\\\sqrt{1-\\\\frac{v^{2}}{c^{2}}}\\\\) সূত্রে দৈর্ঘ্যের অনুপাত বসালে \\\\(v=4.94\\\\times10^{7}\\\\ \\\\mathrm{ms^{-1}}\\\\)।\"}, {\"q\": \"একটি ধাতব পৃষ্ঠ হতে নিঃসৃত ইলেকট্রনের সর্বাধিক বেগ কত হলে নিবৃত্ত বিভব পার্থক্য 0.96V হবে। [KUET 2016-17]\", \"opts\": [\"\\\\(8.21 \\\\times 10^{5} \\\\ \\\\mathrm{ms^{-1}}\\\\)\", \"\\\\(5.81 \\\\times 10^{5} \\\\ \\\\mathrm{ms^{-1}}\\\\)\", \"\\\\(5.72 \\\\times 10^{5} \\\\ \\\\mathrm{ms^{-1}}\\\\)\", \"\\\\(5.63 \\\\times 10^{5} \\\\ \\\\mathrm{ms^{-1}}\\\\)\", \"\\\\(4.28 \\\\times 10^{5} \\\\ \\\\mathrm{ms^{-1}}\\\\)\"], \"ans\": 1, \"why\": \"নিবৃত্ত বিভবে \\\\(eV_s = \\\\frac{1}{2}mv_{max}^2\\\\); এখান থেকে বেগ বের করলে প্রায় \\\\(5.81 \\\\times 10^{5} \\\\ \\\\mathrm{ms^{-1}}\\\\) পাওয়া যায়।\"}, {\"q\": \"একজন ভদ্রমহিলা মহাশূন্যযানে চড়ে 4 আলোকবর্ষ দূরের একটি গ্রহে 0.9c বেগে যাবেন এবং ফিরে আসবেন। তার বয়স তার জমজ বোন (যিনি পৃথিবীতে ছিলেন) এর চেয়ে কত বছর কম হবে? [KUET 2016-17]\", \"opts\": [\"4.4444 Y\", \"8.8888 Y\", \"11.5 Y\", \"20.3888 Y\", \"40.76 Y\"], \"ans\": 2, \"why\": \"পৃথিবীর হিসাবে যাওয়া-আসায় \\\\(80/9\\\\) বছর লাগে, কিন্তু চলমান বোনের নিজস্ব সময় সময়-প্রসারণে কম অতিবাহিত হয়; দুয়ের পার্থক্য প্রায় 11.5 বছর।\"}, {\"q\": \"একটি মহাশূন্যযান কত বেগে ভ্রমণ করলে, মহাশূন্যে 1 দিন অতিবাহিত হলে পৃথিবীতে 2 দিন অতিবাহিত হবে? [KUET 2017-18]\", \"opts\": [\"\\\\(2.61 \\\\times 10^{8} \\\\text{ ms}^{-1}\\\\)\", \"\\\\(2.59 \\\\times 10^{8} \\\\text{ ms}^{-1}\\\\)\"  [\"\\\\(-136\\\\ \\\\mathrm{eV}\\\\)\", \"\\\\(8.22\\\\ \\\\mathrm{MeV}\\\\)\", \"\\\\(288\\\\ \\\\mathrm{MeV}\\\\)\", \"\\\\(8.22\\\\ \\\\mathrm{eV}\\\\)\", \"\\\\(3498\\\\ \\\\mathrm{MeV}\\\\)\"], \"ans\": 1, \"why\": \"17টি প্রোটন ও 18টি নিউট্রনের মোট ভর থেকে নিউক্লিয়াসের ভর বিয়োগ করে ভরত্রুটি পাওয়া যায়; তার মোট বন্ধন শক্তিকে 35 দিয়ে ভাগ করলে প্রতি নিউক্লিয়নে \\\\(8.22\\\\ \\\\mathrm{MeV}\\\\) হয়।\"}, {\"q\": \"হাইড্রোজেন পরমাণুর 5ম বোর কক্ষের ইলেকট্রনের শক্তি কত? [দেওয়া আছে, ইলেকট্রনের ভর এবং আধান যথাক্রমে \\\\(9.1\\\\times10^{-31}\\\\ \\\\mathrm{kg}\\\\) এবং \\\\(1.6\\\\times10^{-19}\\\\ \\\\mathrm{C}\\\\)। শূন্যস্থানের ভেদন যোগ্যতা \\\\(=8.85\\\\times10^{-12}\\\\ \\\\mathrm{C^{2}N^{-1}m^{-2}}\\\\)] [KUET 2015-16]\", \"opts\": [\"\\\\(-13.6\\\\ \\\\mathrm{eV}\\\\)\", \"\\\\(-1.51\\\\ \\\\mathrm{eV}\\\\)\", \"\\\\(-2.72\\\\ \\\\mathrm{eV}\\\\)\", \"\\\\(-0.54\\\\ \\\\mathrm{eV}\\\\)\", \"\\\\(0.54\\\\ \\\\mathrm{eV}\\\\)\"], \"ans\": 3, \"why\": \"হাইড্রোজেনের \\\\(n\\\\)-তম কক্ষে শক্তি \\\\(E_n=-\\\\frac{13.6}{n^{2}}\\\\ \\\\mathrm{eV}\\\\); \\\\(n=5\\\\) হলে \\\\(E=-0.54\\\\ \\\\mathrm{eV}\\\\)।\"}, {\"q\": \"রেডিয়াম এর অর্ধজীবন 1620 বছর। কত সময়ে 1 গ্রাম রেডিয়াম 1 সেন্টিগ্রাম এ পরিণত হবে? [KUET 2016-17]\", \"opts\": [\"\\\\(4.28 \\\\times 10^{-4} \\\\ \\\\mathrm{Y}\\\\)\", \"23.68 Y\", \"1600 Y\", \"5380 Y\", \"10767 Y\"], \"ans\": 4, \"why\": \"ভর 100 গুণ কমতে প্রয়োজনীয় সময় \\\\(t = \\\\frac{1620}{\\\\ln 2}\\\\ln 100\\\\), যা প্রায় 10767 বছর (বইয়ের সমাধানে 10763 Y)।\"}, {\"q\": \"কোন একটি তেজস্ক্রিয় পদার্থের অর্ধায়ু 3.8 দিন। 8 দিনে এই পদার্থের শতকরা কত অংশ ক্ষয় হবে? [KUET 2017-18]\", \"opts\": [\"\\\\(68.7\\\\%\\\\)\", \"\\\\(86.7\\\\%\\\\)\", \"\\\\(76.8\\\\%\\\\)\", \"\\\\(95.0\\\\%\\\\)\", \"\\\\(58.0\\\\%\\\\)\"], \"ans\": 2, \"why\": \"অর্ধায়ু 3.8 দিন ধরে 8 দিন পর অবশিষ্ট অংশ হিসাব করলে প্রায় 23.2% থেকে যায়। অতএব ক্ষয় হওয়া অংশ প্রায় 100 − 23.2 = 76.8%।\"}, {\"q\": \"একটি হাইড্রোজেন পরমাণু \\\\(-1.6 \\\\text{ eV}\\\\) শক্তি অবস্থ  স্থানে \\\\(1\\\\ \\\\mathrm{mm}\\\\) গভীরতার পানি সৃষ্টি করতে পারে। উক্ত পানিকে আবার মেঘে পরিণত করতে কত কাজের প্রয়োজন? [KUET 2015-16]\", \"opts\": [\"\\\\(49\\\\times10^{11}\\\\ \\\\mathrm{J}\\\\)\", \"\\\\(49\\\\times10^{8}\\\\ \\\\mathrm{J}\\\\)\", \"\\\\(4.9\\\\times10^{11}\\\\ \\\\mathrm{ergs}\\\\)\", \"\\\\(9.8\\\\times10^{11}\\\\ \\\\mathrm{N}\\\\)\", \"\\\\(10^{8}\\\\ \\\\mathrm{J}\\\\)\"], \"ans\": 0, \"why\": \"পানির ভর \\\\(m=Ah\\\\rho=1\\\\times10^{8}\\\\ \\\\mathrm{kg}\\\\), তাই প্রয়োজনীয় কাজ \\\\(W=mgh=49\\\\times10^{11}\\\\ \\\\mathrm{J}\\\\)।\"}, {\"q\": \"20000 kg ভরের একটি গাড়ীর ইঞ্জিনের ক্ষমতা 560 H.P. ও কর্মদক্ষতা 80%, গাড়ীটিকে স্থির অবস্থা থেকে \\\\(25 \\\\mathrm{ms^{-1}}\\\\) বেগে আনতে ন্যূনতম কত সময় লাগবে? [1 H.P = 0.746 KW] [KUET 2016-17]\", \"opts\": [\"3.74 sec.\", \"6 sec.\", \"18 sec.\", \"37.4 sec.\", \"374 sec.\"], \"ans\": 2, \"why\": \"গাড়ীর গতিশক্তির বৃদ্ধি \\\\(\\\\frac{1}{2}mv^2\\\\) কে কার্যকর ক্ষমতা (80% of 560 H.P.) দিয়ে ভাগ করলে প্রয়োজনীয় সময় প্রায় 18 সেকেন্ড পাওয়া যায়।\"}, {\"q\": \"একটি ইঞ্জিন 5 মিনিটে কূয়া থেকে 10,000 লিটার পানি \\\\(10 \\\\text{ m}\\\\) গড় উচ্চতায় তুলতে পারে। ইঞ্জিনটির ক্ষমতা \\\\(70\\\\%\\\\) কার্যকর হলে এর অশ্ব ক্ষমতা কোনটি? [KUET 2018-19]\", \"opts\": [\"\\\\(3.35 \\\\text{ hp}\\\\)\", \"\\\\(3.07 \\\\text{ hp}\\\\)\", \"\\\\(3.65 \\\\text{ hp}\\\\)\", \"\\\\(4.38 \\\\text{ hp}\\\\)\", \"\\\\(6.25 \\\\text{ hp}\\\\)\"], \"ans\": 4, \"why\": \"পানি তোলার কার্যকর ক্ষমতাকে কর্মদক্ষতা \\\\(70\\\\%\\\\) দিয়ে ভাগ করে মোট ক্ষমতা বের করে অশ্বক্ষমতায় নিলে প্রায় \\\\(6.25 \\\\text{ hp}\\\\) পাওয়া যায়।\"}]"},"adm-med-1989-90":{"title":"বহুনির্বাচনি পরীক্ষা — মেডিকেল ১৯৮৯-৯০","chapter":"Admission","level":"মেডিকেল","minutes":22,"neg":0.25,"qjson":"[{\"q\": \"একজন লোক সাইকেলে যাচ্ছে। তার সাইকেল টিউবের ভাল্ব যে গতিতে চলছে তা হল- [MED 89-90]\", \"opts\": [\"সরল রৈখিক গতিতে\", \"ঘূর্ণন গতিতে\", \"উপরের উভয় প্রকার গতিতে\", \"উপরের কোনটিই নয়\"], \"ans\": 2, \"why\": \"চাকার ভাল্ব একই সঙ্গে সামনের q\": \"\\\\(0^{\\\\circ}\\\\mathrm{C}\\\\) উষ্ণতায় একখণ্ড বরফকে তাপ দিলে- [MED 89-90]\", \"opts\": [\"উষ্ণতার কোন পরিবর্তন হবে না\", \"উষ্ণতা বাড়িবে\", \"উষ্ণতা কমিবে\", \"বরফ গলিতে থাকিবে\"], \"ans\": 3, \"why\": \"গলনাঙ্কে তাপ দিলে তাপমাত্রা স্থির থেকে বরফ গলতে থাকে—প্রদত্ত তাপ অবস্থা পরিবর্তনে ব্যয় হয়।\"}, {\"q\": \"কোন যন্ত্র দিয়া তাপের পরিমাণ নির্ণয় করা যায়? [MED 89-90]\", \"opts\": [\"Thermometer\", \"Thermoflask\", \"Thermostat\", \"Calorimeter\"], \"ans\": 3, \"why\": \"তাপের পরিমাণ মাপা হয় ক্যালরিমিটার দিয়ে; থার্মোমিটার শুধু তাপমাত্রা মাপে।\"}, {\"q\": \"কোনটির একক ওহম? [MED 89-90]\", \"opts\": [\"রোধ\", \"বিভব\", \"বিদ্যুৎ\", \"চার্জ\"], \"ans\": 0, \"why\": \"রোধের একক ওহম (\\\\(\\\\Omega\\\\))।\"}, {\"q\": \"চৌম্বক প্রাবল্যের একক হল— [MED 89-90]\", \"opts\": [\"ডাইন\", \"ওয়েরস্টেড\", \"আর্গ/একক মেরু\", \"কোনটিই নয়\"], \"ans\": 1, \"why\": \"CGS পদ্ধতিতে চৌম্বক প্রাবল্যের একক ওয়েরস্টেড।\"}, {\"q\": \"দুইটি চৌম্বক মেরুর মধ্যবর্তী দূরত্ব তিনগুণ বৃদ্ধি করা হইলে বল কিরূপ হইবে? [MED 89-90]\", \"opts\": [\"বল তিনগুণ বৃদ্ধি পাইবে\", \"বল প্রাথমিক মানের এক-তৃতীয়াংশ হইবে\", \"বল নয় গুণ বৃদ্ধি পাইবে\", \"কোনটিই নয়\"], \"ans\": 3, \"why\": \"দূরত্ব তিনগুণ হলে বল \\\\(\\\\frac{1}{9}\\\\) অংশ হয়ে যায় — প্রদত্ত অপশনগুলোর কোনটিতেই তা বলা হয়নি।\"}, {\"q\": \"অবতল লেন্সের ক্ষেত্রে বস্তুর প্রতিবিম্ব— [MED 89-90]\", \"opts\": [\"খাড়া এবং বড় হইবে\", \"খাড়া এবং ছোট হইবে\", \"উল্টো এবং ছোট হইবে\", \"উল্টো এবং বড় হইবে\"], \"ans\": 1, \"why\": \"অবতল লেন্সে বস্তুর প্রতিবিম্ব সর্বদা খাড়া (সিধা) এবং বস্তুর চেয়ে ছোট হয়।\"}, {\"q\": \"কোন রঙের দৃশ্যমান আলোর তরঙ্গদৈর্ঘ্য সবচেয়ে বেশি? [MED 89-90]\", \"opts\": [\"লাল\", \"নীল\", \"হলুদ\", \"বেগুনী\"], \"ans\": 0, \"why\": \"দৃশ্যমান বর্ণগুলোর মধ্যে লাল আলোর তরঙ্গদৈর্ঘ্য সর্বাপেক্ষা বেশি।\"}, {\"q\": \"রঞ্জন রশ্মি একটি- [MED 89-90]\", \"opts\": [\"দীঘল তরঙ্গ\", \"তড়িৎ চুম্বকীয় তরঙ্গ\", \"যান্ত্রিক তরঙ্গ\", \"অবলোহিত তরঙ্গ\"], \"ans\": 1, \"why\": \"রঞ্জন রশ্মি একটি তড়িৎ চুম্বকীয় তরঙ্গ।\"}, {\"q\": \"ক্যাথোড রশ্মির গুণাবলীর জন্য কোনটি মিথ্যা? [MED 89-90]\", \"opts\": [\"এই রশ্মি কোন বস্তুর উপর পড়লে তাপ সৃষ্টি করে না\", \"এই রশ্মি সরল পথে চলে\", \"এই রশ্মি ঋণাত্মক কণা বহন করে না\", \"এই রশ্মি নির্দিষ্ট বস্তুর উপর পড়লে উহা উজ্জ্বল দেখায়\"], \"ans\": 0, \"why\": \"ক্যাথোড রশ্মি কোনো বস্তুর উপর পড়লে তাপ সৃষ্টি করে এবং ঋণাত্মক কণা বহন করে — বই অনুযায়ী A ও C দুটোই মিথ্যা।\"}, {\"q\": \"ক্যাথোড রশ্মির ধর্ম- [MED 89-90]\", \"opts\": [\"ইহা সরল পথে গমন করে\", \"ইহা ধনাত্মক চার্জ বিশিষ্ট\", \"ইহার কোন ভর নাই\", \"ইহার আয়নিত করার ক্ষমতা নাই\"], \"ans\": 0, \"why\": \"ক্যাথোড রশ্মি সরল পথে গমন করে — এটিই এর ধর্ম; এটি ঋণাত্মক চার্জবিশিষ্ট, ভর ও আয়নিত করার ক্ষমতা সম্পন্ন।\"}, {\"q\": \"কোনটির ভর সবচেয়ে কম? [MED 89-90]\", \"opts\": [\"ইলেকট্রন\", \"প্রোটন\", \"নিউট্রন\", \"হাইড্রোজেন পরমাণু\"], \"ans\": 0, \"why\": \"ইলেকট্রনের ভর প্রোটনের ভরের প্রায় \\\\(\\\\frac{1}{1837}\\\\) অংশ, তাই প্রদত্তগুলোর মধ্যে সবচেয়ে কম।\"}, {\"q\": \"কোনটি সত্য? [MED 89-90]\", \"opts\": [\"পরমাণুতে ইলেক্ট্রন সবসময় কক্ষপথে ঘুরে না\", \"ইলেক্ট্রন এক্সরে তৈরি করতে পারে না\", \"আলফা রশ্মি হিলিয়াম পরমাণু ছাড়া কিছু নয়\", \"প্রত্যেকটি নিউক্লিয়াস ধনাত্মক চার্জবিশিষ্ট\"], \"ans\": 3, \"why\": \"প্রতিটি নিউক্লিয়াসে প্রোটন থাকায় তা ধনাত্মক চার্জবিশিষ্ট; আলফা রশ্মি হিলিয়াম পরমাণু নয়, হিলিয়াম নিউক্লিয়াস।\"}, {\"q\": \"কোনটি কম্পিউটারের কাজ নয়? [MED 89-90]\", \"opts\": [\"তথ্যাদি সঞ্চিত করে রাখা\", \"জটিল গাণিতিক সমস্যা সমাধান করা\", \"কোন তৈরি পদ্ধতি নিয়ন্ত্রণ করা\", \"কোন নির্দেশ ব্যতিরেকে সিদ্ধান্ত গ্রহণ করা\"], \"ans\": 3, \"why\": \"কম্পিউটার নির্দেশ ছাড়া নিজে সিদ্ধান্ত নিতে পারে না; এটি নির্দেশ অনুযায়ীই কাজ করে।\"}, {\"q\": \"ক্ষুদ্রতম ঘরের মান সবচেয়ে বেশী কোন থার্মোমিটারে? [MED 89-90]\", \"opts\": [\"সেন্টিগ্রেড\", \"রোমার\", \"ফারেনহাইট\", \"ক্লিনিকেল\"], \"ans\": 1, \"why\": \"রোমার স্কেলে বরফবিন্দু ও বাষ্পবিন্দুর ব্যবধান মাত্র \\\\(80^{\\\\circ}\\\\), তাই এর প্রতিটি ঘরের মান সবচেয়ে বড়।\"}, {\"q\": \"স্থায়ী চুম্বক তৈরি হয়- [MED 89-90]\", \"opts\": [\"লোহা + রূপা\", \"লোহা + কোবাল্ট\", \"লোহা + সিলিকন\", \"লোহা + অ্যালুমিনিয়াম\"], \"ans\": 2, \"why\": \"লোহা ও সিলিকনের সংকর (স্ট্যালয়) দিয়ে স্থায়ী চুম্বক তৈরি হয় বলে বইয়ে উত্তর দেওয়া হয়েছে।\"}]"},"adm-med-1991-92":{"title":"বহুনির্বাচনি পরীক্ষা — মেডিকেল ১৯৯১-৯২","chapter":"Admission","level":"মেডিকেল","minutes":16,"neg":0.25,"qjson":"[{\"q\": \"এক কুইন্টাল সমান- [MED 91-92]\", \"opts\": [\"দশ কেজি\", \"একশত কেজি\", \"এক হাজার কেজি\", \"দশ হাজার কেজি\"], \"ans\": 1, \"why\": \"1 কুইন্টাল = 100 কেজি।\"}, {\"q\": \"ভেক্টর রাশি কোন বা কোনগুলি? [MED 91-92]\", \"opts\": [\"বেগ\", \"কাজ\", \"শক্তি\", \"তড়িৎপ্রবাহ\"], \"ans\": 0, \"why\": \"বইয়ের উত্তর A ও D — বেগ ও তড়িৎপ্রবাহকে ভেক্টর রাশি ধরা হয়েছে; কাজ ও শক্তি স্কেলার।\"}, {\"q\": \"কোনটি কম্পাঙ্কের একক নয়? [MED 91-92]\", \"opts\": [\"হার্জ\", \"সাইকেল/সেকেন্ড\", \"বার/সেকেন্ড\", \"রেডিয়ান/সেকেন্ড\"], \"ans\": 3, \"why\": \"রেডিয়ান/সেকেন্ড কৌণিক বেগের একক, কম্পাঙ্কের একক নয়।\"}, {\"q\": \"কোনটি সত্য? [MED 91-92]\", \"opts\": [\"কোন দিন বায়ুর আপেক্ষিক আর্দ্রতা 50% হইলে আমরা অস্বস্তিবোধ করি\", \"বায়ুমণ্ডল সম্পৃক্তরূপে জলীয় বাষ্প দ্বারা সম্পৃক্ত হইলে বায়ুর তাপমাত্রা এবং ইহার শিশিরাঙ্ক সমান হয়\", \"আপেক্ষিক আর্দ্রতা জলীয় বাষ্পের উপর নির্ভর করে না, তাপমাত্রা হ্রাস বৃদ্ধির উপর নির্ভর করে\", \"শিশিরাঙ্ক বায়ুর তাপমাত্রার চেয়ে বেশি হইতে পারে\"], \"ans\": 1, \"why\": \"বায়ু সম্পৃক্ত হলে তার তাপমাত্রা ও শিশিরাঙ্ক সমান হয়; শিশিরাঙ্ক কখনো বায়ুর তাপমাত্রার বেশি হতে পারে না।\"}, {\"q\": \"কোনটি সঠিক? [MED 91-92]\", \"opts\": [\"\\\\(\\\\frac{C}{5} = \\\\frac{F-32}{5}\\\\)\", \"\\\\(\\\\frac{3}{5} = \\\\frac{F}{9}\\\\)\", \"\\\\(\\\\frac{C}{5} = \\\\frac{F-32}{9}\\\\)\", \"\\\\(\\\\frac{C}{5} = \\\\frac{F-32}{11}\\\\)\"], \"ans\": 2, \"why\": \"সেলসিয়াস ও ফারেনহাইট স্কেলের মধ্যে সঠিক সম্পর্ক \\\\(\\\\frac{C}{5} = \\\\frac{F-32}{9}\\\\)।\"}, {\"q\": \"একটি ফাঁপা পরিবাহীর ভিতরে প্রাবল্য হবে- [MED 91-92]\", \"opts\": [\"শূন্য\", \"অসীম\", \"\\\\(E = Q/R^2\\\\)\", \"শূন্যের চেয়ে বড়\"], \"ans\": 0, \"why\": \"ফাঁপা পরিবাহীর ভেতরে তড়িৎ প্রাবল্য সবসময় শূন্য থাকে।\"}, {\"q\": \"হুইটস্টোনের ব্রিজ নীতির উপর ভিত্তি করে নির্মিত যন্ত্রগুলি হচ্ছে- [MED 91-92]\", \"opts\": [\"ভোল্টমিটার\", \"অ্যামিটার\", \"মিটার ব্রিজ\", \"পোস্ট অফিস বক্স\"], \"ans\": 2, \"why\": \"মিটার ব্রিজ ও পোস্ট অফিস বক্স উভয়ই হুইটস্টোন ব্রিজ নীতির উপর ভিত্তি করে নির্মিত।\"}, {\"q\": \"একটি উত্তল লেন্সে গঠিত প্রতিবিম্ব অসদ ও সমশীর্ষ হয়, যখন লক্ষ্যবস্তু— [MED 91-92]\", \"opts\": [\"ফোকাসে থাকে\", \"\\\\(f\\\\) এবং মেরুর মধ্যে থাকে\", \"\\\\(2f\\\\) এ থাকে\", \"\\\\(2f\\\\) এর বাইরে থাকে\"], \"ans\": 1, \"why\": \"লক্ষ্যবস্তু ফোকাস দূরত্বের ভিতরে (\\\\(f\\\\) ও মেরুর মাঝে) থাকলেই উত্তল লেন্সে অসদ ও সমশীর্ষ প্রতিবিম্ব পাওয়া যায়।\"}, {\"q\": \"সাদা আলোক রশ্মি প্রিজমের মধ্য দিয়া যাইবার ফলে যে রঙিন পটি পাওয়া যায় তাহা- [MED 91-92]\", \"opts\": [\"রংধনু\", \"বিচ্যুতি\", \"প্রতিসরণ\", \"বর্ণালি\"], \"ans\": 3, \"why\": \"প্রিজমে সাদা আলো বিচ্ছুরিত হয়ে যে রঙিন পটি পাওয়া যায় তাকে বর্ণালি বলে।\"}, {\"q\": \"মানুষের চোখে লেন্স হতে রেটিনার দূরত্ব 2.5 সেন্টিমিটার হইলে দূরের বস্তু দেখিতে লেন্সের ক্ষমতা ডায়াপ্টারে কত হইবে? [MED 91-92]\", \"opts\": [\"2.5\", \"−25\", \"40\", \"−40\"], \"ans\": 2, \"why\": \"দূরের বস্তুর জন্য লেন্সের ফোকাস দূরত্ব রেটিনার দূরত্বের সমান, তাই \\\\(P = \\\\frac{1}{0.025} = 40\\\\) D।\"}, {\"q\": \"একটি পাত্রের গভীরতা 2d, ইহার অর্ধাংশ \\\\(\\\\mu_1\\\\) প্রতিসরাঙ্কের একটি তরল দ্বারা এবং অপর অর্ধাংশ \\\\(\\\\mu_2\\\\) প্রতিসরাঙ্কের অপর একটি তরল দ্বারা পূর্ণ আছে। খাড়াভাবে তাকাইলে পাত্রের গভীরতা- [MED 91-92]\", \"opts\": [\"\\\\(d(\\\\mu_1 + \\\\mu_2)\\\\)\", \"\\\\(2d\\\\left(\\\\frac{1}{\\\\mu_1} + \\\\mu_2\\\\right)\\\\)\", \"\\\\(d\\\\left(\\\\frac{1}{\\\\mu_1} + \\\\frac{1}{\\\\mu_2}\\\\right)\\\\)\", \"কোনটিই নয়\"], \"ans\": 2, \"why\": \"দুই অর্ধাংশের আপাত গভীরতা যথাক্রমে \\\\(\\\\frac{d}{\\\\mu_1}\\\\) ও \\\\(\\\\frac{d}{\\\\mu_2}\\\\); মোট আপাত গভীরতা \\\\(d\\\\left(\\\\frac{1}{\\\\mu_1} + \\\\frac{1}{\\\\mu_2}\\\\right)\\\\)।\"}, {\"q\": \"মানুষের চোখ হইতে রেটিনার দূরত্ব 2.5 সেন্টিমিটার হইলে দূরের বস্তু দ { J}\\\\)\", \"\\\\(9.81 \\\\text{ J}\\\\)\"], \"ans\": 1, \"why\": \"\\\\(W = mgh = 100 \\\\times 9.81 = 981 \\\\text{ J}\\\\)।\"}, {\"q\": \"বেনজিনের সান্দ্রতার গুণাঙ্ক কত? [MED 04-05]\", \"opts\": [\"\\\\(1.1 \\\\times 10^{3}\\\\)\", \"\\\\(0.2 \\\\times 10^{3}\\\\)\", \"\\\\(1.5 \\\\times 10^{3}\\\\)\", \"\\\\(0.7 \\\\times 10^{-3}\\\\)\"], \"ans\": 3, \"why\": \"বইয়ের তথ্য অনুযায়ী বেনজিনের সান্দ্রতা গুণাঙ্কের মান \\\\(0.7 \\\\times 10^{-3}\\\\)।\"}, {\"q\": \"কোনটি পৃষ্ঠটান সম্পর্কিত ঘটনা নয়? [MED 04-05]\", \"opts\": [\"বল পেনে লেখা হয়\", \"সুচ পানিতে ভাসা\", \"কর্পূরের পানিতে নাচা\", \"ছাতার কাপড়\"], \"ans\": 0, \"why\": \"সুচ পানিতে ভাসা, কর্পূরের নাচা ও ছাতার কাপড়ের পানি-প্রতিরোধ—সবই পৃষ্ঠটানজনিত ঘটনা; বল পেনে লেখা বই অনুযায়ী পৃষ্ঠটানের ঘটনা নয়।\"}, {\"q\": \"কোনটি পৃষ্ঠটানের উপর প্রভাব বিস্তার করে না? [MED 04-05]\", \"opts\": [\"দূষিতকরণ\", \"চৌম্বকত্ব\", \"তড়িতাহিতকরণ\", \"তাপমাত্রা\"], \"ans\": 1, \"why\": \"তাপমাত্রা, দূষিতকরণ ও তড়িতাহিতকরণ পৃষ্ঠটান বদলায়, কিন্তু চৌম্বকত্বের কোনো প্রভাব নেই।\"}, {\"q\": \"তরঙ্গ কত প্রকার? [MED 04-05]\", \"opts\": [\"2\", \"3\", \"4\", \"5\"], \"ans\": 0, \"why\": \"কম্পনের দিক অনুযায়ী তরঙ্গ ২ প্রকার — আড় (অনুপ্রস্থ) ও লম্বিক (অনুদৈর্ঘ্য)।\"}, {\"q\": \"যে কোন পদার্থকে কয়টি উপায়ে চার্জিত করা যায়? [MED 04-05]\", \"opts\": [\"১টি\", \"২টি\", \"৩টি\", \"৪টি\"], \"ans\": 2, \"why\": \"আবেশ, পরিবহন ও ঘর্ষণ — এই ৩টি উপায়ে যেকোনো পদার্থকে চার্জিত করা যায়।\"}, {\"q\": \"তরল সংযোগ বিভবের কারণে কোষে তড়িচ্চালক বল- [MED 04-05]\", \"opts\": [\"হ্রাস পায়\", \"বৃদ্ধি পায়\", \"ধীর গতিতে বৃদ্ধি পায়\", \"স্থির থাকে\"], \"ans\": 0, \"why\": \"তরল সংযোগ বিভব কোষের কার্যকর তড়িচ্চালক বলকে হ্রাস করে।\"}, {\"q\": \"প্রবেশ্যতার একক কি? [MED 04-05]\", \"opts\": [\"\\\\(C^2/N-m^2\\\\)\", \"\\\\(C/N-m^2\\\\)\", \"\\\\(C^2/N^2-m\\\\)\", \"\\\\(C/N^2-m^2\\\\)\"], \"ans\": 0, \"why\": \"প্রবেশ্যতা (permittivity)-এর একক \\\\(\\\\mathrm{C^2\\\\,N^{-1}\\\\,m^{-2}}\\\\)।\"}, {\"q\": \"তড়িৎ চুম্বকীয় তত্ত্ব কে আবিষ্কার করেন? [MED 04-05]\", \"opts\": [\"নিউটন\", \"ডব্লিউ পাওলি\", \"জেমস ওয়াট\", \"জেমস সি ম্যাক্সওয়েল\"], \"ans\": 3, \"why\": \"তড়িৎ চুম্বকীয় তত্ত্ব প্রদান করেন জেমস ক্লার্ক ম্যাক্সওয়েল (1864 সালে)।\"}]"},"adm-med-2013-14":{"title":"বহুনির্বাচনি পরীক্ষা — মেডিকেল ২০১৩-১৪","chapter":"Admission","level":"মেডিকেল","minutes":26,"neg":0.25,"qjson":"[{\"q\": \"পরিমাপে ধনাত্মক ও ঋণাত্মক উভয় প্রকার ত্রুটি হয় কোন কারণে? [MED 13-14]\", \"opts\": [\"যন্ত্রের\", \"পরিবেশগত\", \"তত্ত্বীয়\", \"ব্যক্তিগত\"], \"ans\": 0, \"why\": \"ত্রুটিপূর্ণ যন্ত্রের কারণে পরিমাপকৃত মান প্রকৃত মানের চেয়ে বেশিও হতে পারে, কমও হতে পারে।\"}, {\"q\": \"36 ঘন সেন্টিমিটার আয়তনের একটি বস্তু উহার \\\\(\\\\frac{3}{4}\\\\) অংশ পানির নিচে রেখে ভাসে। বস্তুটির আপেক্ষিক গুরুত্ব হবে- [MED 13-14]\", \"opts\": [\"0.75\", \"0.57\", \"7.5\", \"5.7\"], \"ans\": 0, \"why\": \"ভাসমান বস্তুর আপেক্ষিক গুরুত্ব = পানিতে নিমজ্জিত অংশের ভগ্নাংশ = 3/4 = 0.75।\"}, {\"q\": \"দুটি ভেক্টর \\\\(\\\\vec{A}\\\\) ও \\\\(\\\\vec{B}\\\\) এর মান যথাক্রমে 5 ও 6 একক। এরা কোন বিন্দুতে \\\\(60^{\\\\circ}\\\\) কোণে ক্রিয়াশীল। \\\\(\\\\vec{A} \\\\times \\\\vec{B}\\\\) এর মান কত? [MED 13-14]\", \"opts\": [\"\\\\(15\\\\sqrt{2}\\\\)\", \"\\\\(10\\\\sqrt{3}\\\\)\", \"\\\\(15\\\\sqrt{3}\\\\)\", \"\\\\(15\\\\sqrt{5}\\\\)\"], \"ans\": 2, \"why\": \"\\\\(|\\\\vec{A} \\\\times \\\\vec{B}| = AB\\\\sin\\\\theta = 5 \\\\times 6 \\\\times \\\\sin 60^{\\\\circ} = 15\\\\sqrt{3}\\\\)।\"}, {\"q\": \"কোন বস্তুর বিভিন্ন কণার অবস্থান একটি/দুইটি/তিনটি স্থানাংক দ্বারা নির্দেশ করা যায়। নিম্নের কোনটি দ্বিমাত্রিক বস্তু? [MED 13-14]\", \"opts\": [\"লম্বা সরু কাঠি, ঋজু সুতা\", \"পাথর, ইট\", \"পাতলা কাগজ, পাতলা টিনের পাত\", \"সিলিন্ডার\"], \"ans\": 2, \"why\": \"পাতলা কাগজ বা পাতলা টিনের পাতের কণার অবস্থান দুটি স্থানাংক দ্বারা নির্দেশ করা যায়, তাই এরা দ্বিমাত্রিক বস্তু।\"}, {\"q\": \"ঘড়ির কাঁটার গতি কোন প্রকারের গতি? [MED 13-14]\", \"opts\": [\"বক্র চলন গতি\", \"ঘূর্ণন গতি\", \"চলন-ঘূর্ণন গতি\", \"পর্যাবৃত্ত গতি\"], \"ans\": 1, \"why\": \"ঘড়ির কাঁটা নির্দিষ্ট অক্ষের চারদিকে ঘোরে, তাই এটি ঘূর্ণন গতি (বইয়ে B ও D উভয়ই সঠিক বলা হয়েছে)।\"}, {\"q\": \"দ্বন্দ্বের ভ্রামকের ক্ষেত্রে কোনটি সঠিক নয়? [MED 13-14]\", \"opts\": [\"দ্বন্দ্বের ভ্রামক = বল × দূরত্ব\", \"ঘড়ি সমাবর্তী ঘূর্ণন সৃষ্টিকারী দ্বন্দ্বের ভ্রামক হলো ঋণাত্মক\", \"মাত্রা সমীকরণ \\\\([ML^{2}T^{-2}]\\\\)\", \"ঘূর্ণন অক্ষের অবস্থানের উপর নির্ভরশীল\"], \"ans\": 1, \"why\": \"প্রচলিত রীতি অনুযায়ী ঘড়ির কাঁটার দিকে (সমাবর্তী) ঘূর্ণন সৃষ্টিকারী ভ্রামককে ধনাত্মক ধরা হয়, ঋণাত্মক নয় — তাই উক্তিটি সঠিক নয়।\"}, {\"q\": \"রেলপথ যেখানে বেঁকে গেছে, সেখানে বাঁকের বাইরের দিকের লাইনটিকে একটু উঁচু করা হয়। কোন বলের যোগান দিতে এটি করা হয়ে থাকে? [MED 13-14]\", \"opts\": [\"কেন্দ্রমুখী\", \"ঘর্ষণ বল\", \"মহাকর্ষ বল\", \"তড়িৎ চৌম্বক বল\"], \"ans\": 0, \"why\": \"বাঁকের বাইরের রেল উঁচু করা (ব্যাংকিং) হয় যাতে অভিলম্ব প্রতিক্রিয়ার অনুভূমিক উপাংশ প্রয়োজনীয় কেন্দ্রমুখী বলের যোগান দেয়।\"}, {\"q\": \"যদি একটি হাতঘড়ির সেকেন্ডের কাঁটার দৈর্ঘ্য 1 cm হয়, তাহলে এর প্রান্তের রৈখিক বেগ কত হবে? [MED 13-14]\", \"opts\": [\"0.1047 cm/sec\", \"0.1052 cm/sec\", \"0.0105 cm/sec\", \"0.1470 cm/sec\"], \"ans\": 0, \"why\": \"\\\\(v = \\\\omega r = \\\\frac{2\\\\pi}{60} \\\\times 1 = 0.1047\\\\) cm/sec।\"}, {\"q\": \"শক্তির ক্ষেত্রে কোনটি সঠিক নয়? [MED 13-14]\", \"opts\": [\"বহিঃস্থিতিশক্তি ভূ-পৃষ্ঠ হতে পদার্থের সাময়িক অবস্থানের উপর নির্ভরশীল।\", \"বহির্গতিশক্তি পদার্থের গঠন প্রকৃতির উপর নির্ভরশীল।\", \"অভ্যন্তরীণ স্থিতিশক্তি বস্তু কণার অবস্থান ও গঠন প্রকৃতির উপর নির্ভরশীল।\", \"স্থানান্তরের উপর নির্ভরশীল।\"], \"ans\": 1, \"why\": \"বহির্গতিশক্তি গঠন প্রকৃতির উপর নয়, বস্তুকণার স্থানান্তরের উপর নির্ভরশীল—তাই B সঠিক নয়।\"}, {\"q\": \"নিউটনের মহাকর্ষীয় বল প্রযোজ্য- [MED 13-14]\", \"opts\": [\"শুধুমাত্র ছোট বস্তুর বেলায়\", \"ক্ষুদ্র ও বৃহৎ বস্তু উভয়ের বেলায়\", \"শুধুমাত্র গ্রহের বেলায়\", \"ইহা একটি বিশ্বজনীন ধ্রুবক\"], \"ans\": 1, \"why\": \"মহাকর্ষ একটি সার্বজনীন বল — ক্ষুদ্র কণা থেকে গ্রহ-নক্ষত্র সব বস্তুর ক্ষেত্রেই এটি প্রযোজ্য।\"}, {\"q\": \"অভিকর্ষজ ত্বরণ 'g' এর বেলায় সঠিক নয় কোনটি? [MED 13-14]\", \"opts\": [\"পৃথিবীর কেন্দ্রে 'g' এর মান শূন্য\", \"বিষুবীয় অঞ্চলে 'g' এর মান \\\\(9.78\\\\ \\\\mathrm{ms^{-2}}\\\\)\", \"অক্ষাংশ বাড়লে 'g' বাড়ে\", \"মেরু অঞ্চলে 'g' এর মান সবচেয়ে কম\"], \"ans\": 3, \"why\": \"মেরু অঞ্চলে g-এর মান সবচেয়ে বেশি, সবচেয়ে কম নয় — এ উক্তিটিই অসত্য।\"}, {\"q\": \"চন্দ্র পৃষ্ঠ অপেক্ষা ভূ-পৃষ্ঠে একটি বস্তুর ওজন প্রায় ছয় গুণ বেশি, নীচের কোনটি এর জন্য দায়ী? [MED 13-14]\", \"opts\": [\"চন্দ্রের পৃষ্ঠে অভিকর্ষ কম\", \"চন্দ্র পৃথিবী অপেক্ষা ধীর গতিতে ঘুরে\", \"চন্দ্র পৃষ্ঠে বায়ু নেই\", \"চন্দ্র পৃথিবী অপেক্ষা সূর্য হতে অধিক দূরে\"], \"ans\": 0, \"why\": \"ওজন = ভর × পৃষ্ঠীয় অভিকর্ষ; চাঁদের পৃষ্ঠীয় g পৃথিবীর প্রায় এক-ষষ্ঠাংশ বলেই ওজন ছয় গুণ কম।\"}, {\"q\": \"সান্দ্রতাঙ্কের উপর তাপমাত্রা ও চাপের প্রভাবের ক্ষেত্রে কোনটি সঠিক নয়? [MED 13-14]\", \"opts\": [\"তরল পদার্থের সান্দ্রতা তাপমাত্রা বৃদ্ধির সাথে দ্রুত হ্রাস পায়\", \"গ্যাসের সান্দ্রতা গ্যাস অণুসমূহের গড় বেগের সমানুপাতিক\", \"গ্যাসের সান্দ্রতাঙ্ক চাপের উপর নির্ভরশীল\", \"চাপ বৃদ্ধি পেলে তরল পদার্থের সান্দ্রতাঙ্ক বৃদ্ধি পায়\"], \"ans\": 2, \"why\": \"গ্যাসের সান্দ্রতাঙ্ক চাপের উপর নির্ভরশীল নয়, তাই C বক্তব্যটি সঠিক নয়।\"}, {\"q\": \"কোনটি সত্য? [MED 13-14]\", \"opts\": [\"একই সুতার দুটি কাপড়ে দেহের তাপ যত রক্ষিত হবে ঐ সুতার সমান পুরু একটি কাপড়ে তা অপেক্ষা কম তাপ রক্ষিত হবে\", \"পাতলা কাগজ অপেক্ষা মোটা কাগজের পাত্রে পানি ফোটানো সম্ভব\", \"যে কাপড়ে সুতার অথবা আঁশের ফাঁকে ফাঁকে যত বেশি বায়ু সেই কাপড়ে তাপ বেশি প্রবাহিত হয়\", \"শীতকালে নতুন লেপ অপেক্ষা পুরাতন লেপ বেশি গরম বোধ হয়\"], \"ans\": 0, \"why\": \"দুটি পাতলা কাপড়ের মাঝে আটকে থাকা বায়ুস্তর তাপের কুপরিবাহী হিসেবে কাজ করে একক পুরু কাপড়ের চেয়ে বেশি তাপ আটকে রাখে।\"}, {\"q\": \"যদি আর্দ্র ও শুষ্ক বাল্ব থার্মোমিটার একই তাপমাত্রা নির্দেশ করে তবে আর্দ্রতা হবে— [MED 13-14]\", \"opts\": [\"খুব বেশি\", \"খুব কম\", \"কম\", \"কোনটিই নয়\"], \"ans\": 0, \"why\": \"দুই বাল্বের পাঠ সমান হলে বায়ু জলীয় বাষ্পে সম্পৃক্ত, অর্থাৎ আপেক্ষিক আর্দ্রতা সর্বোচ্চ (100%)।\"}, {\"q\": \"কুলম্বের সূত্রানুসারে কোনটি সঠিক নয়? দুটি বিন্দু চ firebase.initializeApp(CFG);
var auth=firebase.auth(), db=firebase.firestore();
var log=document.getElementById("log");
function L(s){ log.textContent+=s+"\n"; }
auth.onAuthStateChanged(function(u){
  document.getElementById("who").textContent = u ? ("Signed in: "+u.email+" ("+u.uid+")") : "Not signed in.";

});

  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e){ L("LOGIN ERR: "+e.message); });
});
document.getElementById("btnSeed").addEventListener("click",async function(){
  this.disabled=true;
  var ids=Object.keys(window.SEED_AUDIT), ok=0, fail=0;
  for (var i=0;i<ids.length;i++){
    var id=ids[i], d=window.SEED_AUDIT[id];
    var doc={title:d.title,chapter:d.chapter,level:d.level,minutes:d.minutes,qjson:d.qjson};
    if(d.neg!==undefined) doc.neg=d.neg;
    try{ await db.collection("exams").doc(id).set(doc); ok++; L("OK "+id); }
    catch(e){ fail++; L("FAIL "+id+": "+e.message); }
  }
  L("SEED DONE ok="+ok+" fail="+fail);
  var vok=0, vbad=0;
  for (var i=0;i<ids.length;i++){
    var id=ids[i];
    try{
      var snap=await db.collection("exams").doc(id).get();
      var qs=JSON.parse(snap.data().qjson);
      var want=JSON.parse(window.SEED_AUDIT[id].qjson).length;
      if (snap.exists && qs.length===want) { vok++; }
      else { vbad++; L("VERIFY MISMATCH "+id+": got "+(snap.exists?qs.length:"missing")+" want "+want); }

  try{
