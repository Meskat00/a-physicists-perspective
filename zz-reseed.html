রা ন্যানো স্কেলে থাকে।"}, {"q": "একটি BJT ট্রানজিস্টর এর ক্ষেত্রে \\(I_C = 10\\,\\text{mA}\\), \\(I_E = 15\\,\\text{mA}\\) হলে, ওই ট্রানজিস্টরের প্রবাহ লাভ এর মান কত? [BSMRSTU 18-19]", "opts": ["1.5", ".67", "2", ".5"], "ans": 1, "why": "প্রবাহ লাভ \\(\\alpha = I_C/I_E = 10/15 \\approx 0.67\\)।"}, {"q": "একটি ট্রানজিস্টরের কারেন্ট গেইন ও amplification factor এর অনুপাত ১০০:১। নিঃসারক প্রবাহ 200 এম্পিয়ার হলে পীঠ প্রবাহ কত? [BSMRSTU 18-19]", "opts": ["4A", "6A", "2A", "5A"], "ans": 2, "why": "অনুপাত অনুযায়ী পীঠ প্রবাহ \\(= 200/100 = 2\\,\\text{A}\\) (বইয়ের উত্তর)।"}, {"q": "একটি BJT এর জন্য \\(\\alpha = 0.9\\) হলে, \\(\\beta\\) এর মান কত হবে? [BSMRSTU 18-19]", "opts": ["9", "95", "100", "90"], "ans": 0, "why": "\\(\\beta = \\frac{\\alpha}{1-\\alpha} = \\frac{0.9}{0.1} = 9\\)।"}, {"q": "নক্ষত্রের মধ্যে কি বিক্রিয়া ঘটে? [BSMRSTU 18-19]", "opts": ["নিউক্লিয়ার ফিশন", "নিউক্লিয়ার ফিউশন", "রাসায়নিক বিক্রিয়া", "ফটোইলেকট্রিক ইফেক্ট"], "ans": 1, "why": "নক্ষত্রের কেন্দ্রে হালকা নিউক্লিয়াস মিলিত হয়ে ভারী নিউক্লিয়াস গঠনের ফিউশন বিক্রিয়ায় বিপুল শক্তি নির্গত হয়।"}], "neg": 0.25}, {"docId": "adm-ckruet-2021-22", "title": "বহুনির্বাচনি পরীক্ষা — CKRUET ২০২১-২২", "chapter": "Admission", "level": "CKRUET গুচ্ছ (CUET•KUET•RUET)", "minutes": 22, "oldQ": 22, "newQ": 21, "removedCount": 1, "removed": [{"index": 19, "stem": "একটি ট্রানজিস্টর রেডিও 9 V ব্যাটারি দ্বারা 10 mW এ চলে। ট্রানজিস্টর রেডিওর ভিতর দিয়ে প্রবাহিত বিদ্যুৎ ও রোধ নির্ণয় কর।", "ans": 0}], "spellingChangedItems": 0, "source": "admission_build3/exam_docs_d.json", "qjson": [{"q": "দুইটি সমান মানের ভেক্টরের লব্ধির মান কোন অবস্থায় ওদের প্রত্যেকের মানের সমান হতে পারে? [CKRUET 2021-22]", "opts": ["0°", "30°", "60°", "90°", "120°"], "ans": 4, "why": "সমান মান P ও মধ্যবর্তী কোণ \\(\\theta\\) হলে লব্ধি \\(R = 2P\\cos\\frac{\\theta}{2}\\)। \\(R = P\\) হতে হলে \\(\\cos\\frac{\\theta}{2} = \\frac{1}{2}\\), অর্থাৎ \\(\\theta = 120°\\)।"}, {"q": "মনে কর, কোনো একটি ধ্রুব বল এর প্রভাবে একটি বস্তুর সরণ কোনো একটি নির্দিষ্ট দি  "ans": 2, "why": "ত্রুটিপূর্ণ স্কেলে প্রকৃত সেলসিয়াস তাপমাত্রা \\(\\frac{45 - 3}{107 - 3} \\times 100 \\approx 40.38°C\\)। ফারেনহাইটে রূপান্তর করলে \\(\\frac{9}{5} \\times 40.38 + 32 \\approx 104.69°F\\)।"}, {"q": "সাম্যাবস্থান থেকে একটি সরল দোলগতি সম্পন্ন কণার কী পরিমাণ সরণ হলে কণাটির বেগ সর্বোচ্চ বেগের অর্ধেক হবে? [CKRUET 2021-22]", "opts": ["\\(\\pm\\frac{A}{2}\\)", "\\(\\pm\\frac{A}{\\sqrt{2}}\\)", "\\(\\pm A\\sqrt{2}\\)", "\\(\\pm\\frac{\\sqrt{3}}{2}A\\)", "\\(\\pm\\frac{2}{\\sqrt{3}}A\\)"], "ans": 3, "why": "সরল দোল গতিতে \\(v = \\omega\\sqrt{A^2 - x^2}\\) এবং সর্বোচ্চ বেগ \\(\\omega A\\)। \\(v = \\frac{\\omega A}{2}\\) বসালে \\(A^2 - x^2 = \\frac{A^2}{4}\\), অর্থাৎ \\(x = \\pm\\frac{\\sqrt{3}}{2}A\\)।"}, {"q": "একজন বালক ও একজন লোক একত্রে দৌড়াচ্ছেন। বালকটির ভর লোকটির ভরের অর্ধেক এবং লোকটির গতিশক্তি বালকটির গতিশক্তির অর্ধেক। লোকটি যদি তার বেগ 1 ms⁻¹ বৃদ্ধি করেন, তবে তার গতিশক্তি বালকটির গতিশক্তির সমান হয়। বালক ও লোকটির আদিবেগ নির্ণয় কর। [CKRUET 2021-22]", "opts": ["2.31 ms⁻¹, 4.62 ms⁻¹", "2.20 ms⁻¹, 4.30 ms⁻¹", "2.21 ms⁻¹, 4.82 ms⁻¹", "2.41 ms⁻¹, 4.62 ms⁻¹", "2.41 ms⁻¹, 4.82 ms⁻¹"], "ans": 4, "why": "ভর ও গতিশক্তির শর্ত দুটি থেকে বালকের বেগ লোকের বেগের দ্বিগুণ আসে। লোকের বেগ 1 ms⁻¹ বাড়ানোর শর্ত মিলিয়ে সমাধান করলে লোকের আদিবেগ প্রায় 2.41 ms⁻¹ এবং বালকের প্রায় 4.82 ms⁻¹।"}, {"q": "27°C তাপমাত্রার গ্যাসকে কত তাপমাত্রায় নেওয়া হলে গড়বেগ দ্বিগুণ হবে? [CKRUET 2021-22]", "opts": ["54°C", "273°C", "540°C", "1000 K", "927°C"], "ans": 4, "why": "গ্যাসের অণুর গড় বেগ পরম তাপমাত্রার বর্গমূলের সমানুপাতিক। বেগ দ্বিগুণ করতে তাপমাত্রা চারগুণ করতে হয়: \\(300 \\times 4 = 1200\\) K = 927°C।"}, {"q": "একটি কার্নো ইঞ্জিনের কর্মদক্ষতা 50% যখন ইহার তাপগ্রাহকের তাপমাত্রা 27°C। ইঞ্জিনটির কর্মদক্ষতা 60% করতে উৎসের তাপমাত্রা কত বাড়াতে হবে? [CKRUET 2021-22]", "opts": ["60 K", "120 K", "150 K", "160 K", "200 K"], "ans": 2, "why": "গ্রাহকের তাপমাত্রা 300 K। দক্ষতা 50% হলে উৎস \\(T_1 = \\frac{300}{1 - 0.5} = 600\\) K; 60% করতে হলে \\(T_1' = \\frac{300}{1 - 0.6} = 750\\) K। অর্থ
